<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆翻牌 · 小小游乐场</title><link rel="stylesheet" href="style.css"><main><header><div><small>SMALL PLAY / 01</small><h1>记忆翻牌</h1></div><button id="restart">重新开始</button></header><p>翻开两张相同的图案，找到全部 6 对。每翻开第二张牌记一步，翻错后稍等片刻再继续。</p><div class="stats"><span>步数 <b id="moves">0</b></span><span>已配对 <b id="pairs">0</b> / 6</span><span>用时 <b id="time">0</b> 秒</span></div><p id="status" role="status">翻开第一张牌，开始吧</p><section class="board" aria-label="记忆翻牌棋盘"></section><footer>不比手速，试着记住每一张。支持鼠标、触屏和键盘 Tab / Enter。</footer></main><script type="module" src="main.js"></script></html>
