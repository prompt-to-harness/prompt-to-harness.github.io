<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>60 秒躲避与收集</title><link rel="stylesheet" href="style.css"><main><header><div><small>SMALL PLAY / 02</small><h1>60 秒躲避与收集</h1></div></header><p>移动青色圆点收集金色方块，每个 10 分；躲开红色障碍。3 条生命，坚持到 60 秒！</p><div class="stats"><span>得分 <b id="score">0</b></span><span>剩余 <b id="time">60</b> 秒</span><span>生命 <b id="lives">3</b></span></div><div id="field" tabindex="0" role="application" aria-label="躲避游戏，使用方向键或 WASD 移动"></div><div class="actions"><button id="start">开始游戏</button><button id="pause" disabled>暂停</button></div><p id="status" role="status">准备好了吗？点击开始游戏</p><div class="pad" aria-label="触屏方向键"><button data-key="up" aria-label="向上">↑</button><div><button data-key="left" aria-label="向左">←</button><button data-key="down" aria-label="向下">↓</button><button data-key="right" aria-label="向右">→</button></div></div><footer>方向键 / WASD 移动 · P 暂停 · 切换页面自动暂停 · 碰撞后有 1 秒保护</footer></main><script type="module" src="main.js"></script></html>
