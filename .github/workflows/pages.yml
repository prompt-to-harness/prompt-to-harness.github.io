name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The pinned viewer wheel is hosted on GitHub Releases; allow transient download failures.
      UV_HTTP_TIMEOUT: "120"
      UV_HTTP_RETRIES: "5"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Generate static request viewers
        run: UV_LOCKED=1 make viewers
      - name: Check courseware links
        run: uv run --locked courseware/tools/check-courseware.py
      - name: Install browser for lesson checks
        run: uv run --locked playwright install --with-deps chromium
      - name: Check chapter 1 lessons in a browser
        run: uv run --locked courseware/ch01/tools/check-progressive.py
      - name: Check the shared presentation shell in every chapter
        run: uv run --locked courseware/tools/check-presentation.py
      - name: Build site
        run: uv run --locked tools/build-site.py
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
