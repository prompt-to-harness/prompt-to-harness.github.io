name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check courseware links
        run: uv run --locked courseware/tools/check-courseware.py
      - name: Install browser for lesson checks
        run: uv run --locked playwright install --with-deps chromium
      - name: Check chapter 1 lessons in a browser
        run: uv run --locked courseware/ch01/tools/check-progressive.py
      - name: Check the shared presentation shell in every chapter
        run: uv run --locked courseware/tools/check-presentation.py
      - name: Build site
        run: uv run --locked tools/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
