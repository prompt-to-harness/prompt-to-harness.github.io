<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>鹈鹕骑自行车 · 黄昏归途</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, #14132e 0%, #2a1c4f 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: min(95vw, 920px);
    aspect-ratio: 8 / 5;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    border-radius: 18px;
    overflow: hidden;
  }
  svg { width: 100%; height: 100%; display: block; }
  .caption {
    position: fixed;
    bottom: 14px;
    color: #b8b8d4;
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车 2D 动画 · 黄昏归途">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2E2068"/>
      <stop offset="35%"  stop-color="#7A3D6E"/>
      <stop offset="65%"  stop-color="#E96B5E"/>
      <stop offset="100%" stop-color="#FFCB85"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFF6C0"/>
      <stop offset="60%"  stop-color="#FFC36B"/>
      <stop offset="100%" stop-color="#FF8B4A"/>
    </radialGradient>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD27D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD27D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7B8E5C"/>
      <stop offset="100%" stop-color="#3A4A2A"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3D3A52"/>
      <stop offset="100%" stop-color="#1F1D33"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DADAE3"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- 闪烁星 -->
  <g fill="#FFFFFF">
    <circle cx="80"  cy="50"  r="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="30"  r="1.2">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="55"  r="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="35"  r="1">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="65"  r="1.2">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="0.6">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 落日光晕 + 太阳 -->
  <circle cx="640" cy="180" r="170" fill="url(#sunHalo)">
    <animate attributeName="r" values="160;175;160" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="180" r="62" fill="url(#sun)">
    <animate attributeName="r" values="60;64;60" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 飘动云朵 -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        from="900 0" to="-280 0" dur="38s" repeatCount="indefinite"/>
      <ellipse cx="220" cy="110" rx="58" ry="18" fill="#FFC0A8" opacity="0.85"/>
      <ellipse cx="260" cy="100" rx="40" ry="16" fill="#FFD3BC" opacity="0.85"/>
      <ellipse cx="180" cy="115" rx="34" ry="14" fill="#FFC0A8" opacity="0.85"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        from="1100 0" to="-300 0" dur="55s" begin="-18s" repeatCount="indefinite"/>
      <ellipse cx="430" cy="70" rx="48" ry="14" fill="#FFB29B" opacity="0.7"/>
      <ellipse cx="465" cy="62" rx="32" ry="12" fill="#FFC2AF" opacity="0.7"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M 0 340 L 80 280 L 150 320 L 240 250 L 340 310 L 440 260 L 540 290 L 640 240 L 740 280 L 800 270 L 800 380 L 0 380 Z"
        fill="#5B447A" opacity="0.65"/>
  <path d="M 0 360 L 100 320 L 200 350 L 320 290 L 420 340 L 540 300 L 660 330 L 800 310 L 800 380 L 0 380 Z"
        fill="#3E2F5C" opacity="0.85"/>

  <!-- 远处城市轮廓 -->
  <g fill="#2A2244" opacity="0.85">
    <rect x="60"  y="338" width="18" height="32"/>
    <rect x="82"  y="325" width="22" height="45"/>
    <rect x="108" y="335" width="14" height="35"/>
    <rect x="700" y="332" width="20" height="38"/>
    <rect x="724" y="320" width="26" height="50"/>
    <rect x="754" y="340" width="18" height="30"/>
  </g>
  <!-- 城市亮窗 -->
  <g fill="#FFEB8A" opacity="0.85">
    <rect x="68"  y="346" width="3" height="3"/>
    <rect x="68"  y="356" width="3" height="3"/>
    <rect x="88"  y="334" width="3" height="3"/>
    <rect x="95"  y="346" width="3" height="3"/>
    <rect x="88"  y="358" width="3" height="3"/>
    <rect x="113" y="346" width="3" height="3"/>
    <rect x="708" y="342" width="3" height="3"/>
    <rect x="708" y="355" width="3" height="3"/>
    <rect x="730" y="332" width="3" height="3"/>
    <rect x="740" y="342" width="3" height="3"/>
    <rect x="730" y="355" width="3" height="3"/>
    <rect x="745" y="358" width="3" height="3"/>
    <rect x="760" y="350" width="3" height="3"/>
    <rect x="760" y="362" width="3" height="3"/>
  </g>

  <!-- 草地 -->
  <rect x="0" y="370" width="800" height="130" fill="url(#grass)"/>

  <!-- 路面 -->
  <rect x="0" y="425" width="800" height="35" fill="url(#road)"/>
  <line x1="0" y1="425" x2="800" y2="425" stroke="#FFC971" stroke-width="2"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#FFC971" stroke-width="2"/>
  <line x1="-50" y1="442" x2="850" y2="442" stroke="#FFFFFF" stroke-width="3"
        stroke-dasharray="22 18" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- 路边灯柱，向后掠过 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-400 0" dur="2.8s" repeatCount="indefinite"/>
    <g transform="translate(80, 0)">
      <rect x="0" y="350" width="3" height="80" fill="#1a1a2e"/>
      <rect x="-5" y="345" width="13" height="6" fill="#1a1a2e"/>
      <circle cx="2" cy="343" r="4" fill="#FFE082"/>
      <circle cx="2" cy="343" r="9" fill="#FFE082" opacity="0.45">
        <animate attributeName="opacity" values="0.25;0.65;0.25" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(180, 0)">
      <rect x="0" y="350" width="3" height="80" fill="#1a1a2e"/>
      <rect x="-5" y="345" width="13" height="6" fill="#1a1a2e"/>
      <circle cx="2" cy="343" r="4" fill="#FFE082"/>
      <circle cx="2" cy="343" r="9" fill="#FFE082" opacity="0.45">
        <animate attributeName="opacity" values="0.25;0.65;0.25" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(280, 0)">
      <rect x="0" y="350" width="3" height="80" fill="#1a1a2e"/>
      <rect x="-5" y="345" width="13" height="6" fill="#1a1a2e"/>
      <circle cx="2" cy="343" r="4" fill="#FFE082"/>
      <circle cx="2" cy="343" r="9" fill="#FFE082" opacity="0.45">
        <animate attributeName="opacity" values="0.25;0.65;0.25" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(380, 0)">
      <rect x="0" y="350" width="3" height="80" fill="#1a1a2e"/>
      <rect x="-5" y="345" width="13" height="6" fill="#1a1a2e"/>
      <circle cx="2" cy="343" r="4" fill="#FFE082"/>
      <circle cx="2" cy="343" r="9" fill="#FFE082" opacity="0.45">
        <animate attributeName="opacity" values="0.25;0.65;0.25" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 伴飞小鸟 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="900 150" to="-100 150" dur="22s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -8; 0 0" dur="1.2s" repeatCount="indefinite"/>
      <path d="M 0 0 Q 7 -7 16 0 Q 25 -7 32 0" stroke="#2a2244" stroke-width="2" fill="none" stroke-linecap="round">
        <animate attributeName="d"
                 values="M 0 0 Q 7 -7 16 0 Q 25 -7 32 0;
                         M 0 0 Q 7 -2 16 0 Q 25 -2 32 0;
                         M 0 0 Q 7 -7 16 0 Q 25 -7 32 0"
                 dur="0.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 飘落的羽毛 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="-50 260" to="850 120" dur="14s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0; 360" dur="3s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="7" ry="2.5" fill="#FFFFFF" opacity="0.85"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#B0BEC5" stroke-width="0.5"/>
    </g>
  </g>

  <!-- 车身阴影 -->
  <ellipse cx="380" cy="442" rx="175" ry="8" fill="#000000" opacity="0.35"/>

  <!-- ============ 自行车 + 鹈鹕 ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="180 255; 180 252; 180 255"
                      dur="0.55s" repeatCount="indefinite"/>

    <!-- 后轮 -->
    <g>
      <circle cx="60" cy="120" r="50" fill="none" stroke="#1a1a2e" stroke-width="6"/>
      <circle cx="60" cy="120" r="46" fill="none" stroke="#546E7A" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 60 120" to="360 60 120" dur="0.9s" repeatCount="indefinite"/>
        <line x1="60" y1="72"  x2="60" y2="168" stroke="#90A4AE" stroke-width="1.5"/>
        <line x1="12" y1="120" x2="108" y2="120" stroke="#90A4AE" stroke-width="1.5"/>
        <line x1="26" y1="86"  x2="94" y2="154" stroke="#90A4AE" stroke-width="1.5"/>
        <line x1="26" y1="154" x2="94" y2="86"  stroke="#90A4AE" stroke-width="1.5"/>
      </g>
      <circle cx="60" cy="120" r="9" fill="none" stroke="#37474F" stroke-width="1.5"/>
      <circle cx="60" cy="120" r="6" fill="#37474F"/>
      <circle cx="60" cy="120" r="3" fill="#1a1a2e"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="240" cy="120" r="50" fill="none" stroke="#1a1a2e" stroke-width="6"/>
      <circle cx="240" cy="120" r="46" fill="none" stroke="#546E7A" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 240 120" to="360 240 120" dur="0.9s" repeatCount="indefinite"/>
        <line x1="240" y1="72"  x2="240" y2="168" stroke="#90A4AE" stroke-width="1.5"/>
        <line x1="192" y1="120" x2="288" y2="120" stroke="#90A4AE" stroke-width="1.5"/>
        <line x1="206" y1="86"  x2="274" y2="154" stroke="#90A4AE" stroke-width="1.5"/>
        <line x1="206" y1="154" x2="274" y2="86"  stroke="#90A4AE" stroke-width="1.5"/>
      </g>
      <circle cx="240" cy="120" r="6" fill="#37474F"/>
      <circle cx="240" cy="120" r="3" fill="#1a1a2e"/>
    </g>

    <!-- 车架 -->
    <g stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="60"  y1="120" x2="150" y2="55"/>
      <line x1="150" y1="55"  x2="240" y2="120"/>
      <line x1="150" y1="55"  x2="170" y2="120"/>
      <line x1="60"  y1="120" x2="170" y2="120"/>
      <line x1="170" y1="120" x2="240" y2="120"/>
      <line x1="240" y1="120" x2="220" y2="40"/>
      <line x1="220" y1="40"  x2="240" y2="120"/>
    </g>
    <line x1="60" y1="118" x2="150" y2="53" stroke="#FF8A80" stroke-width="2" opacity="0.7"/>
    <line x1="150" y1="53" x2="240" y2="118" stroke="#FF8A80" stroke-width="2" opacity="0.7"/>

    <!-- 链条：链节随踏频向后滚动 -->
    <line x1="60" y1="120" x2="170" y2="120" stroke="#37474F" stroke-width="2.2" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.45s" repeatCount="indefinite"/>
    </line>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 60 120" to="-360 60 120" dur="0.9s" repeatCount="indefinite"/>
      <line x1="60" y1="111" x2="60" y2="129" stroke="#90A4AE" stroke-width="1"/>
      <line x1="51" y1="120" x2="69" y2="120" stroke="#90A4AE" stroke-width="1"/>
    </g>

    <!-- 坐垫 -->
    <line x1="150" y1="55" x2="160" y2="30" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="160" cy="26" rx="20" ry="6" fill="#1a1a2e"/>

    <!-- 车把 + 铃铛 -->
    <line x1="240" y1="120" x2="230" y2="40" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
    <line x1="230" y1="40" x2="200" y2="30" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
    <circle cx="200" cy="30" r="5" fill="#37474F"/>
    <circle cx="230" cy="40" r="3" fill="#37474F"/>
    <circle cx="222" cy="38" r="4" fill="#FFB300" stroke="#37474F" stroke-width="1"/>

    <!-- 曲柄 + 踏板 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 170 120" to="360 170 120" dur="0.9s" repeatCount="indefinite"/>
      <line x1="170" y1="120" x2="195" y2="105" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
      <line x1="170" y1="120" x2="145" y2="135" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
      <rect x="190" y="100" width="14" height="6" fill="#1a1a2e" rx="1"/>
      <rect x="138" y="130" width="14" height="6" fill="#1a1a2e" rx="1"/>
    </g>
    <circle cx="170" cy="120" r="7" fill="#546E7A"/>
    <circle cx="170" cy="120" r="4" fill="#37474F"/>

    <!-- 两条腿随蹬踏摆动 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-3 160 100; 3 160 100; -3 160 100"
                        dur="0.9s" repeatCount="indefinite"/>
      <line x1="160" y1="100" x2="180" y2="125" stroke="#F57C00" stroke-width="5" stroke-linecap="round"/>
      <line x1="160" y1="100" x2="145" y2="130" stroke="#F57C00" stroke-width="5" stroke-linecap="round"/>
      <path d="M 175 125 L 195 122 L 188 132 Z" fill="#FF9800"/>
      <path d="M 150 130 L 132 138 L 145 134 Z" fill="#FF9800"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g>
      <!-- 尾羽（朝后） -->
      <path d="M 105 50 L 65 35 L 78 75 Z" fill="url(#bodyGrad)" stroke="#37474F" stroke-width="2.5"/>

      <!-- 身体 -->
      <ellipse cx="160" cy="50" rx="55" ry="32" fill="url(#bodyGrad)" stroke="#37474F" stroke-width="2.5"/>

      <!-- 翅膀扑动 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-8 175 45; 6 175 45; -8 175 45"
                          dur="0.6s" repeatCount="indefinite"/>
        <ellipse cx="175" cy="45" rx="42" ry="22" fill="#ECEFF1" stroke="#37474F" stroke-width="2.5"/>
        <path d="M 145 38 Q 175 25 215 50" fill="none" stroke="#37474F" stroke-width="1.5" opacity="0.6"/>
        <path d="M 145 55 Q 175 70 215 55" fill="none" stroke="#37474F" stroke-width="1.5" opacity="0.6"/>
        <path d="M 155 45 L 200 45" stroke="#37474F" stroke-width="0.8" opacity="0.4"/>
        <path d="M 155 50 L 200 50" stroke="#37474F" stroke-width="0.8" opacity="0.4"/>
        <path d="M 155 55 L 200 55" stroke="#37474F" stroke-width="0.8" opacity="0.4"/>
      </g>

      <!-- 颈部 S 形 -->
      <path d="M 200 30 Q 240 5 265 -5 Q 280 -10 285 0 Q 270 25 235 30 Z"
            fill="url(#bodyGrad)" stroke="#37474F" stroke-width="2.5"/>

      <!-- 头部 -->
      <circle cx="285" cy="-10" r="22" fill="url(#bodyGrad)" stroke="#37474F" stroke-width="2.5"/>

      <!-- 头顶呆毛 -->
      <path d="M 280 -28 Q 285 -38 290 -30" fill="none" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>
      <path d="M 285 -30 Q 286 -38 291 -32" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

      <!-- 腮红 -->
      <ellipse cx="285" cy="2" rx="5" ry="2.5" fill="#F8BBD0" opacity="0.8"/>

      <!-- 眼睛 -->
      <circle cx="298" cy="-15" r="5" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/>
      <circle cx="299" cy="-14" r="2.6" fill="#263238"/>
      <circle cx="300" cy="-15" r="0.8" fill="#FFFFFF"/>
      <!-- 眨眼 -->
      <rect x="293" y="-16" width="10" height="3" fill="url(#bodyGrad)" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.7;0.85;0.9;0.95" dur="5s" repeatCount="indefinite"/>
      </rect>

      <!-- 上喙 -->
      <path d="M 302 -8 L 360 -3 L 360 4 L 302 1 Z" fill="#FFB300" stroke="#37474F" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- 下喙 + 喉囊，随呼吸起伏 -->
      <path d="M 302 1 Q 335 18 360 10 Q 348 22 320 16 Q 305 14 300 5 Z"
            fill="#FFA000" stroke="#37474F" stroke-width="2.5" stroke-linejoin="round">
        <animate attributeName="d"
                 values="M 302 1 Q 335 18 360 10 Q 348 22 320 16 Q 305 14 300 5 Z;
                         M 304 1 Q 335 16 358 9 Q 348 22 320 14 Q 308 14 300 5 Z;
                         M 302 1 Q 335 18 360 10 Q 348 22 320 16 Q 305 14 300 5 Z"
                 dur="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 320 -1 Q 340 6 358 4" stroke="#FFE082" stroke-width="1.5" fill="none" opacity="0.7"/>

      <!-- 喙尖小钩 -->
      <path d="M 358 -4 Q 364 -3 360 2 Z" fill="#37474F"/>
    </g>
  </g>

  <!-- 标题 -->
  <text x="400" y="478" text-anchor="middle"
        font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.92">
    黄昏归途 · 海风骑行 🌅
  </text>
</svg>
</div>
<div class="caption">SVG 绘制 · 纯 SMIL 动画 · m3_3</div>
</body>
</html>
