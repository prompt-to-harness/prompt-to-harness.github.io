    body[data-mode='scroll'] #p14 .p-repro,

    body[data-mode='scroll'] #p15 .p-repro { grid-row: 2; }
    #p13 .p-repro-body, #p14 .p-repro-body, #p15 .p-repro-body, #p16 .p-repro-body, #p17 .p-repro-body { width: 100%; box-sizing: border-box; }
    #p13 .p-repro .p-jumps, #p16 .p-repro .p-jumps { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 14px; }

    }
    #p13 .p-repro .p-jumps a::after, #p16 .p-repro .p-jumps a::after { content: "↗"; color: #5B6573; font-weight: 400; }
    #p13 .p-repro .p-jumps a:hover, #p13 .p-repro .p-jumps a:focus-visible,
    #p16 .p-repro .p-jumps a:hover, #p16 .p-repro .p-jumps a:focus-visible { background: #F1EEE4; }
    #p13 .p-repro .p-jumps a:focus-visible, #p16 .p-repro .p-jumps a:focus-visible { outline: 2px solid #243042; outline-offset: 2px; }
    body[data-mode='slides'] #p13 .p-repro,
    body[data-mode='slides'] #p14 .p-repro,
    body[data-mode='slides'] #p15 .p-repro,
    body[data-mode='slides'] #p16 .p-repro,
    body[data-mode='slides'] #p17 .p-repro { position: static; align-items: flex-start; }
    body[data-mode='slides'] #p13 .p-repro-body,
    body[data-mode='slides'] #p14 .p-repro-body,
    body[data-mode='slides'] #p15 .p-repro-body,
    body[data-mode='slides'] #p16 .p-repro-body,
    body[data-mode='slides'] #p17 .p-repro-body {
      position: fixed; left: 50%; top: 50%; z-index: 8;
      transform: translate(-50%, -50%);
      width: min(1080px, calc(100vw - 64px)); max-width: none; max-height: min(620px, calc(100vh - 96px));
      overflow: auto; box-shadow: 0 16px 40px rgba(24,32,43,.24);
    }
    body[data-mode='slides'] #p13 .p-repro[open]::before,
    body[data-mode='slides'] #p14 .p-repro[open]::before,
    body[data-mode='slides'] #p15 .p-repro[open]::before,
    body[data-mode='slides'] #p16 .p-repro[open]::before,
    body[data-mode='slides'] #p17 .p-repro[open]::before {
      content: ""; position: fixed; inset: 0; z-index: 7; cursor: default;
    }
    @media (max-width: 1100px) {
      body[data-mode='scroll'] #p13 .scene-content,
      body[data-mode='scroll'] #p14 .scene-content,
      body[data-mode='scroll'] #p15 .scene-content { grid-template-columns: 1fr; }
      body[data-mode='scroll'] #p13 .p-repro,
      body[data-mode='scroll'] #p14 .p-repro,
      body[data-mode='scroll'] #p15 .p-repro { grid-row: auto; }
    }
    @media (max-width: 600px) {
      body[data-mode='scroll'] #p18 .preparation-next h3 { font-size: 24px; }
      body[data-mode='scroll'] #p18 .preparation-lead { font-size: 19px; }
    }
  </style>

  <script>
    const redirectMergedClosingPage = () => {
      if (location.hash !== '#p19') return;
      const url = new URL(location.href);
      url.hash = 'p18';
      url.searchParams.set('step', '3');
      try { history.replaceState(null, '', url); }
      catch (_) { location.replace(url.href); }
    };
    redirectMergedClosingPage();
    window.addEventListener('hashchange', redirectMergedClosingPage);
    document.addEventListener('click', (event) => {
      if (document.body.dataset.mode !== 'slides') return;
      if (event.target.closest('.p-repro summary, .p-repro-body')) return;
      for (const id of ['p13', 'p14', 'p15', 'p16', 'p17']) {
        const panel = document.querySelector(`#${id} .p-repro[open]`);
        if (panel) panel.open = false;
      }
    });
  </script>
