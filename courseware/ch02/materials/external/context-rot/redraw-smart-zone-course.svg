<svg xmlns="http://www.w3.org/2000/svg" class="lesson-diagram" viewBox="0 0 840 330" width="840" height="330"><defs><marker id="rd-arrow-smart-zone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6573"/></marker></defs><rect x="40" y="90" width="319.2" height="70" rx="10" fill="#E3F1EC" stroke="#0B6B5F" stroke-width="2.5" filter="url(#p-rough)"/><text x="199.6" y="133.64" style="font-family:'Course Sans',sans-serif" font-size="24" font-weight="700" fill="#243042" text-anchor="middle">smart zone</text><rect x="359.2" y="90" width="440.8" height="70" rx="10" fill="#FDE7DF" stroke="#D9481C" stroke-width="2.5" filter="url(#p-rough)"/><text x="579.6" y="133.64" style="font-family:'Course Sans',sans-serif" font-size="24" font-weight="700" fill="#243042" text-anchor="middle">dumb zone</text><text x="48" y="194" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="400" fill="#0B6B5F" text-anchor="start">清醒、专注、记得住</text><text x="367.2" y="194" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="400" fill="#D9481C" text-anchor="start">更粗心、更健忘、错更多</text><line x1="359.2" y1="44" x2="359.2" y2="168" stroke="#5B6573" stroke-width="2"/><text x="359.2" y="36" style="font-family:'Course Sans',sans-serif" font-size="17" font-weight="400" fill="#5B6573" text-anchor="middle">从哪里开始：因模型和任务而异</text><line x1="800" y1="70" x2="800" y2="220" stroke="#243042" stroke-width="3"/><text x="800" y="244" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="400" fill="#243042" text-anchor="end">窗口上限</text><text x="800" y="268" style="font-family:'Course Sans',sans-serif" font-size="16" font-weight="400" fill="#5B6573" text-anchor="end">质量早在这之前就下降了</text><path d="M40 300L460 300" stroke="#5B6573" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-smart-zone)"/><text x="470" y="306" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="400" fill