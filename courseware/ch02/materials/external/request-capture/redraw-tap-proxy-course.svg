<svg xmlns="http://www.w3.org/2000/svg" class="lesson-diagram" viewBox="0 0 1168 280" width="1168" height="280"><defs><marker id="rd-arrow-tap-proxy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6573"/></marker></defs><rect x="8" y="8" width="755" height="264" rx="10" fill="none" stroke="#5B6573" stroke-width="1.5" stroke-dasharray="8 6" filter="url(#p-rough)"/><text x="25" y="35" style="font-family:'Course Sans',sans-serif" font-size="20" font-weight="400" fill="#5B6573" text-anchor="start">我们的电脑</text><text x="950" y="35" style="font-family:'Course Sans',sans-serif" font-size="20" font-weight="400" fill="#5B6573" text-anchor="start">远端</text><rect x="30" y="60" width="205" height="90" rx="10" fill="#EDEBFB" stroke="#5A51D1" stroke-width="2.5" filter="url(#p-rough)"/><text x="132" y="96" style="font-family:'Course Sans',sans-serif" font-size="25" font-weight="700" fill="#5A51D1" text-anchor="middle">Codex CLI</text><text x="132" y="128" style="font-family:'Course Sans',sans-serif" font-size="20" font-weight="400" fill="#243042" text-anchor="middle">组装好这次请求</text><rect x="420" y="60" width="315" height="90" rx="10" fill="#E0F3EF" stroke="#0B6B5F" stroke-width="2.5" filter="url(#p-rough)"/><text x="577" y="96" style="font-family:'Course Sans',sans-serif" font-size="25" font-weight="700" fill="#0B6B5F" text-anchor="middle">claude-tap 本地代理</text><text x="577" y="128" style="font-family:'Course Sans',sans-serif" font-size="20" font-weight="400" fill="#243042" text-anchor="middle">接收、记录、转发</text><rect x="955" y="60" width="205" height="90" rx="10" fill="#FFFDF7" stroke="#243042" stroke-width="2.5" filter="url(#p-rough)"/><text x="1057" y="96" style="font-family:'Course Sans',sans-serif" font-size="25" font-weight="700" fill="#243042" text-anchor="middle">模型服务</text><text x="1057" y="128" style="font-family:'Course Sans',sans-serif" font-size="20" font-weight="400" fill="#243042" text-anchor="middl