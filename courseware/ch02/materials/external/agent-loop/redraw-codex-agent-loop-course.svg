<svg xmlns="http://www.w3.org/2000/svg" class="lesson-diagram" viewBox="0 0 900 404" width="900" height="404"><defs><marker id="rd-arrow-codex-agent-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6573"/></marker></defs><g data-reveal="0"><text x="0" y="26" style="font-family:'Course Sans',sans-serif" font-size="22" font-weight="700" fill="#243042" text-anchor="start">一句话，几次请求</text></g><g data-reveal="0"><rect x="40" y="50" width="220" height="46" rx="10" fill="#FDE7DF" stroke="#D9481C" stroke-width="2.5" filter="url(#p-rough)"/><text x="150.0" y="79.48" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="700" fill="#243042" text-anchor="middle">你的一句 Prompt</text></g><g data-reveal="0"><path d="M150 98L150 132" stroke="#5B6573" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-codex-agent-loop)"/></g><g data-reveal="0"><rect x="40" y="136" width="220" height="46" rx="10" fill="#E4E1FA" stroke="#5A51D1" stroke-width="2.5" filter="url(#p-rough)"/><text x="150.0" y="165.48" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="700" fill="#243042" text-anchor="middle">模型</text></g><g data-reveal="0"><path d="M150 184L150 218" stroke="#5B6573" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-codex-agent-loop)"/></g><g data-reveal="0"><text x="160" y="208" style="font-family:'Course Sans',sans-serif" font-size="15" font-weight="400" fill="#5B6573" text-anchor="start">要调用工具</text></g><g data-reveal="0"><rect x="40" y="222" width="220" height="46" rx="10" fill="#DDF1EC" stroke="#0B6B5F" stroke-width="2.5" filter="url(#p-rough)"/><text x="150.0" y="251.48" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="700" fill="#243042" text-anchor="middle">Codex 执行工具</text></g><g data-reveal="0"><path d="M 40 245 C 4 245, 4 159, 38 159" stroke="#5B6573" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-codex-agent-loop)" fil