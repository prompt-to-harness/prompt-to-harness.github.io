ddle">工具返回</text></g><g data-reveal="3"><path d="M795.0 320L795.0 346" stroke="#5B6573" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-codex-agent-loop)"/></g><g data-reveal="3"><text x="795.0" y="368" style="font-family:'Course Sans',sans-serif" font-size="16" font-weight="700" fill="#243042" text-anchor="middle">模型给出最终回答</text></g><g data-reveal="3"><text x="330" y="392" style="font-family:'Course Sans',sans-serif" font-size="15" font-weight="400" fill="#5B6573" text-anchor="start">虚线框：原样重发、一字不改　示意，轮数以实际记录为准</text></g></svg>
