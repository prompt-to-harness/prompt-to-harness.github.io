<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="60 秒躲避与收集：躲开紫色障碍，吃下能量宝石，用方向键或 WASD 移动。">
<meta name="theme-color" content="#141a2e">
<title>60 秒躲避与收集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./game.css">
</head>
<body>
<main class="app">
  <header class="app__header">
    <h1 class="title">💎 60 秒躲避与收集</h1>
    <p class="subtitle">躲开紫色障碍，吃下宝石，撑过 60 秒。</p>
  </header>

  <section class="stats stats--play" aria-label="本局数据">
    <div class="stat"><span class="stat__label">时间</span><span class="stat__value" id="stat-time">60</span></div>
    <div class="stat"><span class="stat__label">得分</span><span class="stat__value" id="stat-score">0</span></div>
    <div class="stat"><span class="stat__label">生命</span><span class="stat__value stat__value--lives" id="stat-lives">❤❤❤</span></div>
  </section>

  <section class="board-wrap">
    <div class="arena">
      <canvas id="board" width="800" height="500" role="img"
              aria-label="游戏场地：紫色方块是障碍，绿色圆环是宝石"></canvas>
    </div>
  </section>

  <footer class="app__footer">
    <p class="hint">按方向键或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 开始并移动：<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd></p>
    <button class="btn btn--ghost btn--small" id="show-result" type="button" hidden>结算面板</button>
  </footer>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="overlay__panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-describedby="overlay-text">
    <div class="overlay__emoji" id="overlay-emoji" aria-hidden="true">🎉</div>
    <h2 class="overlay__title" id="overlay-title">时间到！</h2>
    <p class="overlay__text" id="overlay-text"></p>
    <div class="overlay__actions">
      <button class="btn btn--primary" id="overlay-again" type="button">再玩一局</button>
      <button class="btn btn--ghost" id="sound-toggle" type="button" aria-pressed="true">🔊 音效</button>
      <button class="btn btn--ghost" id="overlay-close" type="button">关闭</button>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
