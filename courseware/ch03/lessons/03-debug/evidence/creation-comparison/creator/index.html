<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>霓虹闪避 · 60 秒躲避与收集</title>
  <link rel="stylesheet" href="./assets/purple-theme.css" />
  <link rel="stylesheet" href="./styles/game.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="title">⚡ 霓虹闪避</h1>
      <p class="subtitle">60 秒内躲开紫色风暴，收集能量碎片。</p>
    </header>

    <section class="stats stats--game" aria-label="本局数据">
      <div class="stat">
        <span class="stat__label">剩余时间</span>
        <span class="stat__value" id="stat-time" aria-live="polite">60</span>
      </div>
      <div class="stat">
        <span class="stat__label">得分</span>
        <span class="stat__value" id="stat-score" aria-live="polite">0</span>
      </div>
      <div class="stat">
        <span class="stat__label">生命</span>
        <span class="stat__value stat__value--lives" id="stat-lives" aria-live="polite">♥♥♥</span>
      </div>
    </section>

    <section class="app__main">
      <div class="field-wrap panel">
        <canvas id="stage" class="stage" width="960" height="540"
                aria-label="躲避与收集的游戏场地" role="img"></canvas>
        <p class="field-tip" id="field-tip">按 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 开始</p>
      </div>
    </section>

    <footer class="app__footer">
      <p class="hint">键盘操作：<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · 撞到障碍扣 1 点生命，收集碎片 +10 分</p>
    </footer>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay__panel" role="dialog" aria-modal="true"
         aria-labelledby="overlay-title" aria-describedby="overlay-text">
      <div class="overlay__emoji" id="overlay-emoji" aria-hidden="true">🎉</div>
      <h2 class="overlay__title" id="overlay-title">时间到！</h2>
      <p class="overlay__text" id="overlay-text"></p>
      <div class="overlay__actions">
        <button class="btn btn--primary" id="overlay-again" type="button">↻ 再玩一局</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
