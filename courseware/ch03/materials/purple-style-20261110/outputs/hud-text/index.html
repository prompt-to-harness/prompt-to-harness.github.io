<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60 秒躲避与收集 · 界面原型</title>
<meta name="description" content="“60 秒躲避与收集”的 HUD 与暂停面板界面示意原型（紫色系网页小游戏视觉风格）">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>

<main class="app">

  <header class="masthead">
    <h1 class="title">60 秒躲避与收集</h1>
    <p class="subtitle">躲开玫红色的危险脉冲，收集翠绿色的能量晶体 · 界面示意原型</p>
  </header>

  <!-- HUD：位于游戏区之外，不遮挡观战视线（SKILL §7 骨架：数据条 + 工具栏） -->
  <section class="hud" aria-label="游戏信息栏">
    <div class="stats">
      <div class="stat">
        <span class="stat__label">剩余时间</span>
        <span class="stat__value num" id="statTime">00:42</span>
      </div>

      <div class="stat">
        <span class="stat__label">生命</span>
        <span class="stat__row">
          <span class="stat__value num" id="statLives">3</span>
          <span class="hearts" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </span>
        </span>
      </div>

      <div class="stat">
        <span class="stat__label">分数</span>
        <span class="stat__value num" id="statScore">120</span>
      </div>
    </div>

    <button type="button" class="btn btn--primary hud__toggle" id="pauseToggle" aria-pressed="false" aria-controls="pauseOverlay">
      <span class="btn__icon" aria-hidden="true">
        <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" focusable="false"><rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/></svg>
        <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" focusable="false"><path d="M8 5.14v13.72L19 12 8 5.14z" fill="currentColor"/></svg>
      </span>
      <span id="toggleLabel">暂停</span>
    </button>
  </section>

  <!-- 图例：形状 + 颜色 + 文字三重冗余，避免只靠颜色传达语义（SKILL §5） -->
  <ul class="legend" aria-label="元素图例">
    <li class="legend__item">
      <span class="swatch swatch--player" aria-hidden="true"></span>玩家 · 你
    </li>
    <li class="legend__item">
      <span class="swatch swatch--gem" aria-hidden="true"></span>收集物 · +10 分
    </li>
    <li class="legend__item">
      <span class="swatch swatch--hazard" aria-hidden="true"></span>障碍物 · 碰到扣 1 命
    </li>
  </ul>

  <!-- 游戏区 -->
  <section class="stage" id="stage" aria-label="游戏区示意">
    <div class="field">
      <span class="field__badge">示意模式 · 未实现移动与碰撞</span>

      <div class="entity entity--player" style="--x:16%; --y:57%">
        <span class="shape shape--player">
          <span class="player__core"></span>
          <span class="player__dir"></span>
        </span>
        <span class="entity__tag">你</span>
      </div>

      <div class="entity entity--gem" style="--x:37%; --y:23%">
        <span class="shape shape--gem">
          <svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
            <defs>
              <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#b8f7d4"/><stop offset=".55" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/>
              </linearGradient>
            </defs>
            <path d="M16 2 L28 9 L28 23 L16 30 L4 23 L4 9 Z" fill="url(#gemGrad)" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M16 2 L28 9 L16 16 L4 9 Z" fill="rgba(255,255,255,.22)"/>
          </svg>
        </span>
      </div>

      <div class="entity entity--gem" style="--x:60%; --y:15%">
        <span class="shape shape--gem">
          <svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
            <path d="M16 2 L28 9 L28 23 L16 30 L4 23 L4 9 Z" fill="url(#gemGrad)" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M16 2 L28 9 L16 16 L4 9 Z" fill="rgba(255,255,255,.22)"/>
          </svg>
        </span>
      </div>

      <div class="entity entity--gem" style="--x:75%; --y:41%">
        <span class="shape shape--gem">
          <svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
            <path d="M16 2 L28 9 L28 23 L16 30 L4 23 L4 9 Z" fill="url(#gemGrad)" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M16 2 L28 9 L16 16 L4 9 Z" fill="rgba(255,255,255,.22)"/>
          </svg>
        </span>
      </div>

      <div class="entity entity--gem" style="--x:52%; --y:77%">
        <span class="shape shape--gem">
          <svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
            <path d="M16 2 L28 9 L28 23 L16 30 L4 23 L4 9 Z" fill="url(#gemGrad)" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M16 2 L28 9 L16 16 L4 9 Z" fill="rgba(255,255,255,.22)"/>
          </svg>
        </span>
      </div>

      <div class="entity entity--hazard" style="--x:47%; --y:45%">
        <span class="shape shape--hazard">
          <svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
            <defs>
              <linearGradient id="hzGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffb0bc"/><stop offset=".55" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/>
              </linearGradient>
              <pattern id="hzStripe" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                <rect width="7" height="7" fill="url(#hzGrad)"/>
                <rect width="3.5" height="7" fill="rgba(255,255,255,.16)"/>
              </pattern>
            </defs>
            <path d="M16 3 L30 29 L2 29 Z" fill="url(#hzStripe)" stroke="rgba(255,255,255,.5)" stroke-width="1.4" stroke-linejoin="round"/>
            <g fill="rgba(255,255,255,.95)"><rect x="14.6" y="12.5" width="2.8" height="8.4" rx="1.4"/><circle cx="16" cy="24.3" r="1.7"/></g>
          </svg>
        </span>
      </div>

      <div class="entity entity--hazard" style="--x:88%; --y:66%">
        <span class="shape shape--hazard">
          <svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
            <path d="M16 3 L30 29 L2 29 Z" fill="url(#hzStripe)" stroke="rgba(255,255,255,.5)" stroke-width="1.4" stroke-linejoin="round"/>
            <g fill="rgba(255,255,255,.95)"><rect x="14.6" y="12.5" width="2.8" height="8.4" rx="1.4"/><circle cx="16" cy="24.3" r="1.7"/></g>
          </svg>
        </span>
      </div>

      <div class="entity entity--hazard" style="--x:91%; --y:16%">
        <span class="shape shape--hazard">
          <svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
            <path d="M16 3 L30 29 L2 29 Z" fill="url(#hzStripe)" stroke="rgba(255,255,255,.5)" stroke-width="1.4" stroke-linejoin="round"/>
            <g fill="rgba(255,255,255,.95)"><rect x="14.6" y="12.5" width="2.8" height="8.4" rx="1.4"/><circle cx="16" cy="24.3" r="1.7"/></g>
          </svg>
        </span>
      </div>
    </div>

    <!-- 暂停浮层：遮罩 + 模糊 + 有色玻璃面板，与游戏画面明确区分（SKILL §2 / §8） -->
    <div class="overlay" id="pauseOverlay" hidden>
      <div class="panel" id="pausePanel" role="dialog" aria-labelledby="pauseTitle" aria-describedby="pauseDesc">
        <span class="panel__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" focusable="false"><rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/></svg>
        </span>

        <h2 class="panel__title" id="pauseTitle">已暂停</h2>
        <p class="panel__desc" id="pauseDesc">游戏进度已冻结，倒计时与分数保持当前状态。</p>

        <ul class="panel__stats">
          <li><span class="panel__stat-label">剩余</span><span class="panel__stat-value num" id="panelTime">00:42</span></li>
          <li><span class="panel__stat-label">生命</span><span class="panel__stat-value num" id="panelLives">3</span></li>
          <li><span class="panel__stat-label">分数</span><span class="panel__stat-value num" id="panelScore">120</span></li>
        </ul>

        <div class="panel__actions">
          <button type="button" class="btn btn--primary" id="resumeBtn">继续游戏</button>
          <button type="button" class="btn btn--ghost" id="restartBtn">重新开始</button>
        </div>

        <p class="panel__hint">也可以按 Esc 或空格继续</p>
      </div>
    </div>
  </section>

  <footer class="tips">
    <p class="tips__row">操作：方向键 / WASD 移动 · 空格暂停或继续 · Esc 关闭暂停面板</p>
    <p class="tips__row tips__row--note">本页面为界面示意原型：HUD 数值为固定示意值，未实现移动、碰撞与计分逻辑。</p>
  </footer>

</main>

<script src="app.js"></script>
</body>
</html>
