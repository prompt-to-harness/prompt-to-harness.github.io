<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="60 秒躲避与收集 · 开始界面局部原型（紫色系网页小游戏视觉风格）"
    />
    <title>60 秒躲避与收集 · 开始界面</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <!-- 标题：居中 + 副标题（§7） -->
      <header class="masthead">
        <p class="eyebrow">开始界面 · 局部原型</p>
        <h1 class="game-title">60 秒躲避与收集</h1>
        <p class="game-subtitle">
          躲开危险、收集星星，在倒计时结束前堆出最高分。
        </p>
      </header>

      <!-- 工具栏：左设置组 / 右主行动（§7） -->
      <div class="toolbar panel" role="group" aria-label="开始设置">
        <div class="toolbar__group toolbar__group--settings">
          <span class="toolbar__label">设置</span>
          <button
            id="sound-toggle"
            class="btn btn--secondary btn--toggle"
            type="button"
            aria-pressed="true"
          >
            <svg
              id="sound-on-icon"
              class="btn__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z" />
              <path d="M15.6 9.4a3.9 3.9 0 0 1 0 5.2" />
              <path d="M18.2 7a7.4 7.4 0 0 1 0 10" />
            </svg>
            <svg
              id="sound-off-icon"
              class="btn__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
              hidden
            >
              <path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z" />
              <path d="m16 9.8 4.6 4.6M20.6 9.8 16 14.4" />
            </svg>
            <span class="btn__text">音效：<span id="sound-state">开</span></span>
          </button>
        </div>

        <div class="toolbar__group toolbar__group--action">
          <button id="start-btn" class="btn btn--primary" type="button">
            <svg
              id="start-icon"
              class="btn__icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M8 5.4v13.2L19 12 8 5.4z" />
            </svg>
            <span id="start-label">开始游戏</span>
            <span id="start-dot" class="pulse-dot" aria-hidden="true" hidden></span>
          </button>
        </div>
      </div>

      <!-- 规则摘要：等宽统计块，上标签下数值（§7） -->
      <section class="databar" aria-label="规则摘要">
        <div class="stat panel">
          <span class="stat__icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="8" />
              <path d="M12 7.6V12l3 1.9" />
            </svg>
          </span>
          <span class="stat__label">单局时长</span>
          <span class="stat__value">60<span class="stat__unit">秒</span></span>
        </div>

        <div class="stat panel">
          <span class="stat__icon stat__icon--danger" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 19.6s-6.6-4.1-6.6-8.8A3.8 3.8 0 0 1 12 8.2a3.8 3.8 0 0 1 6.6 2.6c0 4.7-6.6 8.8-6.6 8.8z"
              />
            </svg>
          </span>
          <span class="stat__label">初始生命</span>
          <span class="stat__value">3<span class="stat__unit">点</span></span>
        </div>

        <div class="stat panel">
          <span class="stat__icon stat__icon--reward" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="m12 4.2 2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8L12 4.2z"
              />
            </svg>
          </span>
          <span class="stat__label">得分来源</span>
          <span class="stat__value stat__value--word">收集得分</span>
        </div>
      </section>

      <!-- 主舞台：仅承载「开始 / 预览中」两种界面状态，不含玩法 -->
      <section class="stage panel" aria-label="预览舞台">
        <div class="stage__state is-active" id="state-idle">
          <span class="stage__glyph" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M8 5.4v13.2L19 12 8 5.4z" />
            </svg>
          </span>
          <p class="stage__headline">按下「开始游戏」进入 60 秒预览</p>
          <p class="stage__note">
            玩法本体、危险物与计分尚未接入，这里只是开始界面的占位舞台。
          </p>
          <ul class="legend" aria-label="场上语义图例">
            <li class="legend__item legend__item--danger">
              <span class="legend__mark" aria-hidden="true"></span>
              <span class="legend__name">危险</span>扣血
            </li>
            <li class="legend__item legend__item--reward">
              <span class="legend__mark" aria-hidden="true"></span>
              <span class="legend__name">奖励</span>加分
            </li>
            <li class="legend__item legend__item--player">
              <span class="legend__mark" aria-hidden="true"></span>
              <span class="legend__name">玩家</span>存活
            </li>
          </ul>
        </div>

        <div class="stage__state" id="state-running" inert>
          <p class="stage__headline stage__headline--glow">预览中</p>
          <p class="stage__note">
            60 秒躲避与收集 · 预览中：开始流程已连通，玩法本体尚未接入。
          </p>
          <div class="bar" aria-hidden="true">
            <span class="bar__fill"></span>
          </div>
          <button id="reset-btn" class="btn btn--secondary btn--sm" type="button">
            返回标题
          </button>
        </div>
      </section>

      <p class="footnote">
        键盘 Tab 聚焦、Enter 开始预览 · 本原型只覆盖开始界面。
      </p>
    </main>

    <!-- 屏幕阅读器播报区：状态变化不只靠颜色传达 -->
    <p id="live" class="sr-only" role="status" aria-live="polite"></p>

    <script>
      (function () {
        'use strict';

        var startBtn = document.getElementById('start-btn');
        var startLabel = document.getElementById('start-label');
        var startIcon = document.getElementById('start-icon');
        var startDot = document.getElementById('start-dot');
        var resetBtn = document.getElementById('reset-btn');

        var soundBtn = document.getElementById('sound-toggle');
        var soundState = document.getElementById('sound-state');
        var soundOnIcon = document.getElementById('sound-on-icon');
        var soundOffIcon = document.getElementById('sound-off-icon');

        var idleState = document.getElementById('state-idle');
        var runningState = document.getElementById('state-running');
        var live = document.getElementById('live');

        var running = false;
        var soundOn = true;

        /* 开始界面只维护两种状态：待开始 / 预览中 */
        function setRunning(next) {
          running = next;

          var show = running ? runningState : idleState;
          var hide = running ? idleState : runningState;

          show.classList.add('is-active');
          show.removeAttribute('inert');
          hide.classList.remove('is-active');
          hide.setAttribute('inert', '');

          if (running) {
            startLabel.textContent = '预览中';
            startIcon.hidden = true;
            startDot.hidden = false;
            startBtn.setAttribute('aria-disabled', 'true');
          } else {
            startLabel.textContent = '开始游戏';
            startIcon.hidden = false;
            startDot.hidden = true;
            startBtn.removeAttribute('aria-disabled');
          }

          live.textContent = running ? '预览中' : '已返回标题';
        }

        startBtn.addEventListener('click', function () {
          if (running) {
            return;
          }
          setRunning(true);
        });

        resetBtn.addEventListener('click', function () {
          setRunning(false);
          startBtn.focus();
        });

        soundBtn.addEventListener('click', function () {
          soundOn = !soundOn;
          soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
          soundState.textContent = soundOn ? '开' : '关';
          soundOnIcon.hidden = !soundOn;
          soundOffIcon.hidden = soundOn;
          live.textContent = soundOn ? '音效已开启' : '音效已关闭';
        });
      })();
    </script>
  </body>
</html>
