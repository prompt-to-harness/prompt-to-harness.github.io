<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1782.5359999999998 193.8" width="1782.5359999999998" height="193.8" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="browser" data-to="browser_pass" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="290.315,76.9 290.315,96.9 157.305,96.9 157.305,116.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="browser" data-to="browser_fail" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="290.315,76.9 290.315,96.9 423.3249999999999,96.9 423.3249999999999,116.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="git" data-to="git_pass" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="869.7789999999999,76.9 869.7789999999999,96.9 722.6899999999999,96.9 722.6899999999999,116.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="git" data-to="git_fail" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="869.7789999999999,76.9 869.7789999999999,96.9 1016.8679999999999,96.9 1016.8679999999999,116.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="cli" data-to="cli_pass" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1436.6459999999997,76.9 1436.6459999999997,96.9 1285.1109999999999,96.9 1285.1109999999999,116.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="cli" data-to="cli_fail" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1436.6459999999997,76.9 1436.6459999999997,96.9 1588.181,96.9 1588.181,116.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="browser" data-label="浏览器：检查当前环境" data-shape="rectangle">
  <rect x="195.24" y="40" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="290.315" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">浏览器：检查当前环境</text>
</g>
<g class="node" data-id="browser_pass" data-label="通过证据：打开并刷新环境页" data-shape="rectangle">
  <rect x="40" y="116.9" width="234.60999999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="157.305" y="135.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">通过证据：打开并刷新环境页</text>
</g>
<g class="node" data-id="browser_fail" data-label="未通过时：核对路径或本地服务" data-shape="rectangle">
  <rect x="298.6099999999999" y="116.9" width="249.42999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="423.3249999999999" y="135.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">未通过时：核对路径或本地服务</text>
</g>
<g class="node" data-id="git" data-label="Git：检查当前环境" data-shape="rectangle">
  <rect x="789.5239999999999" y="40" width="160.51" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="869.7789999999999" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Git：检查当前环境</text>
</g>
<g class="node" data-id="git_pass" data-label="通过证据：版本、分支、状态与 Diff 可读" data-shape="rectangle">
  <rect x="572.04" y="116.9" width="301.29999999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="722.6899999999999" y="135.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">通过证据：版本、分支、状态与 Diff 可读</text>
</g>
<g class="node" data-id="git_fail" data-label="未通过时：补齐 Git 与独立仓库" data-shape="rectangle">
  <rect x="897.3399999999999" y="116.9" width="239.05599999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1016.8679999999999" y="135.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">未通过时：补齐 Git 与独立仓库</text>
</g>
<g class="node" data-id="cli" data-label="Codex CLI：检查当前环境" data-shape="rectangle">
  <rect x="1333.0494999999999" y="40" width="207.19299999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1436.6459999999997" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Codex CLI：检查当前环境</text>
</g>
<g class="node" data-id="cli_pass" data-label="通过证据：从练习目录启动成功" data-shape="rectangle">
  <rect x="1160.396" y="116.9" width="249.42999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1285.1109999999999" y="135.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">通过证据：从练习目录启动成功</text>
</g>
<g class="node" data-id="cli_fail" data-label="未通过时：仅用已核验桌面入口临时起步" data-shape="rectangle">
  <rect x="1433.826" y="116.9" width="308.71" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1588.181" y="135.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">未通过时：仅用已核验桌面入口临时起步</text>
</g>
</svg>