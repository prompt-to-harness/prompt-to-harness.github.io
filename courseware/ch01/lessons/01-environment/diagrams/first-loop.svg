<svg xmlns="http://www.w3.org/2000/svg" class="lesson-diagram" viewBox="0 -35 1168 350" role="img" aria-labelledby="first-loop-title"><title id="first-loop-title">确认后修改，检查通过则记录，不符则修正后复查，无法继续则停止</title><defs><marker id="first-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#243042"/></marker><filter id="first-rough"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter></defs><g data-edge="goal:plan" data-reveal="0"><path d="M176 52 H196" fill="none" stroke="#243042" stroke-width="2" marker-end="url(#first-arrow)"/></g><g data-edge="plan:confirm" data-reveal="0"><path d="M372 52 H392" fill="none" stroke="#243042" stroke-width="2" marker-end="url(#first-arrow)"/></g><g data-edge="confirm:edit" data-reveal="0"><path d="M568 52 H588" fill="none" stroke="#243042" stroke-width="2" marker-end="url(#first-arrow)"/></g><g data-edge="edit:check" data-reveal="1"><path d="M764 52 H784" fill="none" stroke="#243042" stroke-width="2" marker-end="url(#first-arrow)"/></g><g data-edge="check:record" data-reveal="1"><path d="M960 52 H980" fill="none" stroke="#243042" stroke-width="2" marker-end="url(#first-arrow)"/><text x="969" y="-10" text-anchor="middle" font-size="18" fill="#243042">通过</text></g><g data-edge="check:repair" data-reveal="1"><path d="M852 104 V151 H676 V200" fill="none" stroke="#243042" stroke-width="2" marker-end="url(#first-arrow)"/><text x="752" y="143" text-anchor="middle" font-size="18" fill="#243042">不符</text></g><g data-edge="repair:check" data-reveal="1"><path d="M764 252 H920 V104" fill="none" stroke="#243042" stroke-width="2" marker-end="url(#first-arrow)"/><text x="878" y="190" text-anchor="middle" font-size="18" fill="#243042">再检查</text></g><g data-edge="check:stop" data-reveal="2"><path d="M940 104 V160 H1068 V200" fill="none" stroke="#243042" stroke-width="2" marker-end="url(#first-arrow)"/><text x="1032" y="184" text-anchor="middle" font-size="18" fill="#243042">无法继续</text></g><g data-node="goal" data-reveal="0"><rect x="2" y="2" width="172" height="100" rx="8" fill="#FFFDF7" stroke="#243042" stroke-width="2" filter="url(#first-rough)"/><text x="88" y="43" text-anchor="middle" font-size="25" fill="#243042" class="diagram-title">说明目标</text><text x="88" y="76" text-anchor="middle" font-size="18" fill="#243042">范围与完成标准</text></g><g data-node="plan" data-reveal="0"><rect x="198" y="2" width="172" height="100" rx="8" fill="#EDEBFB" stroke="#5A51D1" stroke-width="2" filter="url(#first-rough)"/><text x="284" y="43" text-anchor="middle" font-size="25" fill="#5A51D1" class="diagram-title">复述与计划</text><text x="284" y="76" text-anchor="middle" font-size="18" fill="#243042">核对理解</text></g><g data-node="confirm" data-reveal="0"><rect x="394" y="2" width="172" height="100" rx="8" fill="#FFFDF7" stroke="#243042" stroke-width="2" filter="url(#first-rough)"/><text x="480" y="43" text-anchor="middle" font-size="25" fill="#243042" class="diagram-title">人工确认</text><text x="480" y="76" text-anchor="middle" font-size="18" fill="#243042">写入前的决定</text></g><g data-node="edit" data-reveal="0"><rect x="590" y="2" width="172" height="100" rx="8" fill="#FFFDF7" stroke="#243042" stroke-width="2" filter="url(#first-rough)"/><text x="676" y="43" text-anchor="middle" font-size="25" fill="#243042" class="diagram-title">执行修改</text><text x="676" y="76" text-anchor="middle" font-size="18" fill="#243042">指定文字</text></g><g data-node="check" data-reveal="1"><rect x="786" y="2" width="172" height="100" rx="8" fill="#FFFDF7" stroke="#243042" stroke-width="2" filter="url(#first-rough)"/><text x="872" y="43" text-anchor="middle" font-size="25" fill="#243042" class="diagram-title">检查结果</text><text x="872" y="76" text-anchor="middle" font-size="18" fill="#243042">页面 + 完整 Diff</text></g><g data-node="record" data-reveal="1"><rect x="982" y="2" width="172" height="100" rx="8" fill="#E3F2E6" stroke="#15803D" stroke-width="2" filter="url(#first-rough)"/><text x="1068" y="43" text-anchor="middle" font-size="25" fill="#15803D" class="diagram-title">接受并记录</text><text x="1068" y="76" text-anchor="middle" font-size="18" fill="#243042">留下证据</text></g><g data-node="repair" data-reveal="1"><rect x="590" y="202" width="172" height="100" rx="8" fill="#FFFDF7" stroke="#243042" stroke-width="2" filter="url(#first-rough)"/><text x="676" y="243" text-anchor="middle" font-size="25" fill="#243042" class="diagram-title">反馈并修正</text><text x="676" y="276" text-anchor="middle" font-size="18" fill="#243042">准确差异，限定范围</text></g><g data-node="stop" data-reveal="2"><rect x="982" y="202" width="172" height="100" rx="8" fill="#FCE6DD" stroke="#D9481C" stroke-width="2" filter="url(#first-rough)"/><text x="1068" y="243" text-anchor="middle" font-size="25" fill="#D9481C" class="diagram-title">停止并记录</text><text x="1068" y="276" text-anchor="middle" font-size="18" fill="#243042">无法验证或需越界</text></g></svg>