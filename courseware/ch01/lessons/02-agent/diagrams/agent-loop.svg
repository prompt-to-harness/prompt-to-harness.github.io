<svg xmlns="http://www.w3.org/2000/svg" class="lesson-diagram" viewBox="0 0 1168 370" role="img" aria-labelledby="title-agent-loop" style="--rough:url(#rough-agent-loop)"><title id="title-agent-loop">五节点执行循环：继续回到提出动作，完成或停止退出</title><style>.diagram-arrow{fill:none;stroke:#243042;stroke-width:2.5}.sketch{filter:var(--rough)}text{font-family:Course Sans,Noto Sans SC,sans-serif}.diagram-title{font-family:Course Title,Noto Sans SC,sans-serif}</style><defs><filter id="rough-agent-loop" filterUnits="userSpaceOnUse" x="-30" y="-30" width="1228" height="430"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.3"/></filter><marker id="arrow-agent-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243042"/></marker></defs><g data-reveal="0" class=""><g data-node="input"><rect x="10" y="35" width="210" height="112" rx="12" fill="#F4F2EB" stroke="#243042" stroke-width="2" class="sketch"/><text x="28" y="65" text-anchor="start" font-size="18" fill="#243042" class=""><tspan x="28" dy="0">01</tspan></text><text x="115" y="99" text-anchor="middle" font-size="27" fill="#243042" class="diagram-title"><tspan x="115" dy="0">任务输入</tspan></text><text x="115" y="128" text-anchor="middle" font-size="18" fill="#5B6573" class=""><tspan x="115" dy="0">只改指定欢迎语</tspan></text></g></g><g data-reveal="1" class=""><g data-node="action"><rect x="242" y="35" width="210" height="112" rx="12" fill="#EDEBFB" stroke="#5A51D1" stroke-width="2" class="sketch"/><text x="260" y="65" text-anchor="start" font-size="18" fill="#5A51D1" class=""><tspan x="260" dy="0">02</tspan></text><text x="347" y="99" text-anchor="middle" font-size="27" fill="#5A51D1" class="diagram-title"><tspan x="347" dy="0">提出动作</tspan></text><text x="347" y="128" text-anchor="middle" font-size="18" fill="#5B6573" class=""><tspan x="347" dy="0">请求读取目标文件</tspan></text></g></g><g data-reveal="1" class=""><path data-edge="input:action" d="M220 91H236" class="diagram-arrow" marker-end="url(#arrow-agent-loop)"/></g><g data-reveal="1" class=""><g data-node="tool"><rect x="474" y="35" width="210" height="112" rx="12" fill="#E0F3EF" stroke="#0B6B5F" stroke-width="2" class="sketch"/><text x="492" y="65" text-anchor="start" font-size="18" fill="#0B6B5F" class=""><tspan x="492" dy="0">03</tspan></text><text x="579" y="99" text-anchor="middle" font-size="27" fill="#0B6B5F" class="diagram-title"><tspan x="579" dy="0">工具执行</tspan></text><text x="579" y="128" text-anchor="middle" font-size="18" fill="#5B6573" class=""><tspan x="579" dy="0">执行文件读取</tspan></text></g></g><g data-reveal="1" class=""><path data-edge="action:tool" d="M452 91H468" class="diagram-arrow" marker-end="url(#arrow-agent-loop)"/></g><g data-reveal="2" class=""><g data-node="result"><rect x="706" y="35" width="210" height="112" rx="12" fill="#F2EDE1" stroke="#6E6043" stroke-width="2" class="sketch"/><text x="724" y="65" text-anchor="start" font-size="18" fill="#6E6043" class=""><tspan x="724" dy="0">04</tspan></text><text x="811" y="99" text-anchor="middle" font-size="27" fill="#6E6043" class="diagram-title"><tspan x="811" dy="0">结果返回</tspan></text><text x="811" y="128" text-anchor="middle" font-size="18" fill="#5B6573" class=""><tspan x="811" dy="0">文件内容或报错</tspan></text></g></g><g data-reveal="2" class=""><path data-edge="tool:result" d="M684 91H700" class="diagram-arrow" marker-end="url(#arrow-agent-loop)"/></g><g data-reveal="3" class=""><g data-node="next"><rect x="938" y="35" width="210" height="112" rx="12" fill="#EDEBFB" stroke="#5A51D1" stroke-width="2" class="sketch"/><text x="956" y="65" text-anchor="start" font-size="18" fill="#5A51D1" class=""><tspan x="956" dy="0">05</tspan></text><text x="1043" y="99" text-anchor="middle" font-size="27" fill="#5A51D1" class="diagram-title"><tspan x="1043" dy="0">下一步</tspan></text><text x="1043" y="128" text-anchor="middle" font-size="18" fill="#5B6573" class=""><tspan x="1043" dy="0">修改、再读或停止</tspan></text></g></g><g data-reveal="3" class=""><path data-edge="result:next" d="M916 91H932" class="diagram-arrow" marker-end="url(#arrow-agent-loop)"/></g><g data-reveal="4" class=""><path data-edge="next:action" d="M1043 147V205H347V154" class="diagram-arrow sketch" marker-end="url(#arrow-agent-loop)"/><text x="657" y="238" text-anchor="middle" font-size="22" fill="#5A51D1" class=""><tspan x="657" dy="0">继续：依据结果提出新动作</tspan></text><path data-edge="next:end" d="M1043 205V276" class="diagram-arrow sketch" marker-end="url(#arrow-agent-loop)"/><text x="1030" y="258" text-anchor="end" font-size="18" fill="#243042" class=""><tspan x="1030" dy="0">完成或停止</tspan></text><g data-node="end"><rect x="936" y="285" width="214" height="60" rx="12" fill="#F4F2EB" stroke="#243042" stroke-width="2" class="sketch"/><text x="1043" y="325" text-anchor="middle" font-size="25" fill="#243042" class="diagram-title"><tspan x="1043" dy="0">退出循环</tspan></text></g><text x="20" y="305" text-anchor="start" font-size="22" fill="#243042" class=""><tspan x="20" dy="0">人的位置：确认目标与范围</tspan><tspan x="20" dy="31.9">按授权执行，依据结果验收</tspan></text></g></svg>