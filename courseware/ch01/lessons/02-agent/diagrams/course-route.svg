<svg xmlns="http://www.w3.org/2000/svg" class="lesson-diagram" viewBox="0 0 1168 370" role="img" aria-labelledby="title-course-route" style="--rough:url(#rough-course-route)"><title id="title-course-route">Prompt、Vibe Coding、SDD、Harness 逐层叠加，始终保留验证和人工判断</title><style>.diagram-arrow{fill:none;stroke:#243042;stroke-width:2.5}.sketch{filter:var(--rough)}text{font-family:Lesson Body,Noto Sans SC,sans-serif}.diagram-title{font-family:Lesson Title,Noto Sans SC,sans-serif}</style><defs><filter id="rough-course-route" filterUnits="userSpaceOnUse" x="-30" y="-30" width="1228" height="430"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.3"/></filter><marker id="arrow-course-route" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243042"/></marker></defs><g data-reveal="0" class=""><g data-node="prompt"><rect x="12" y="146" width="272" height="150" rx="12" fill="#F4F2EB" stroke="#243042" stroke-width="2" class="sketch"/><text x="32" y="186" text-anchor="start" font-size="30" fill="#243042" class="diagram-title"><tspan x="32" dy="0">Prompt</tspan></text><text x="32" y="227" text-anchor="start" font-size="23" fill="#243042" class=""><tspan x="32" dy="0">说清当前任务</tspan></text><text x="32" y="265" text-anchor="start" font-size="19" fill="#5B6573" class=""><tspan x="32" dy="0">任务说明</tspan></text></g></g><g data-reveal="1" class=""><g data-node="vibe"><rect x="302" y="108" width="272" height="150" rx="12" fill="#F4F2EB" stroke="#243042" stroke-width="2" class="sketch"/><text x="322" y="148" text-anchor="start" font-size="30" fill="#243042" class="diagram-title"><tspan x="322" dy="0">Vibe Coding</tspan></text><text x="322" y="189" text-anchor="start" font-size="23" fill="#243042" class=""><tspan x="322" dy="0">看结果再迭代</tspan></text><text x="322" y="227" text-anchor="start" font-size="19" fill="#5B6573" class=""><tspan x="322" dy="0">页面与检查记录</tspan></text></g><path data-edge="prompt:vibe" d="M286 188H297" class="diagram-arrow" marker-end="url(#arrow-course-route)"/></g><g data-reveal="2" class=""><g data-node="sdd"><rect x="592" y="70" width="272" height="150" rx="12" fill="#F4F2EB" stroke="#243042" stroke-width="2" class="sketch"/><text x="612" y="110" text-anchor="start" font-size="30" fill="#243042" class="diagram-title"><tspan x="612" dy="0">SDD</tspan></text><text x="612" y="151" text-anchor="start" font-size="23" fill="#243042" class=""><tspan x="612" dy="0">固定需求与验收</tspan></text><text x="612" y="189" text-anchor="start" font-size="19" fill="#5B6573" class=""><tspan x="612" dy="0">规格与验收条目</tspan></text></g><path data-edge="vibe:sdd" d="M576 150H587" class="diagram-arrow" marker-end="url(#arrow-course-route)"/></g><g data-reveal="3" class=""><g data-node="harness"><rect x="882" y="32" width="272" height="150" rx="12" fill="#F4F2EB" stroke="#243042" stroke-width="2" class="sketch"/><text x="902" y="72" text-anchor="start" font-size="30" fill="#243042" class="diagram-title"><tspan x="902" dy="0">Harness</tspan></text><text x="902" y="113" text-anchor="start" font-size="23" fill="#243042" class=""><tspan x="902" dy="0">复用规则与检查</tspan></text><text x="902" y="151" text-anchor="start" font-size="19" fill="#5B6573" class=""><tspan x="902" dy="0">规则与检查入口</tspan></text></g><path data-edge="sdd:harness" d="M866 112H877" class="diagram-arrow" marker-end="url(#arrow-course-route)"/></g><g data-reveal="3" class=""><rect x="12" y="315" width="1142" height="48" rx="12" fill="#243042" stroke="#243042" stroke-width="2" class="sketch"/><text x="583" y="347" text-anchor="middle" font-size="24" fill="#FFFFFF" class=""><tspan x="583" dy="0">每一层都保留：看证据、作判断、再验证</tspan></text></g></svg>