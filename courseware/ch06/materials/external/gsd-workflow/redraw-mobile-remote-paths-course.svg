<svg xmlns="http://www.w3.org/2000/svg" class="lesson-diagram" viewBox="0 0 1118 336" width="1118" height="336"><defs><marker id="rd-arrow-mobile-remote-paths" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6573"/></marker></defs><g data-reveal="0"><rect x="8" y="12" width="1102" height="128" rx="10" fill="#E3F2E6" stroke="#15803D" stroke-width="2.5" filter="url(#p-rough)"/></g><g data-reveal="0"><text x="28" y="42" style="font-family:'Course Title','Course Sans',sans-serif" font-size="20" font-weight="400" fill="#15803D" text-anchor="start">通路 A：手机 Remote 页 ── 接着看桌面上的 Codex 任务</text></g><g data-reveal="0"><rect x="28" y="56" width="356" height="68" rx="10" fill="#FFFDF7" stroke="#243042" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="0"><text x="206" y="85" style="font-family:'Course Sans',sans-serif" font-size="19" font-weight="700" fill="#243042" text-anchor="middle">桌面端 Codex 任务</text></g><g data-reveal="0"><text x="206" y="110" style="font-family:'Course Sans',sans-serif" font-size="16" font-weight="400" fill="#5B6573" text-anchor="middle">正在桌面环境里运行的那条会话</text></g><g data-reveal="0"><path d="M390 90L566 90" stroke="#15803D" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-mobile-remote-paths)"/></g><g data-reveal="0"><text x="478" y="78" style="font-family:'Course Sans',sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="middle">同一条通路 · 接着看</text></g><g data-reveal="0"><rect x="572" y="56" width="516" height="68" rx="10" fill="#FFFDF7" stroke="#15803D" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="0"><text x="830" y="85" style="font-family:'Course Sans',sans-serif" font-size="19" font-weight="700" fill="#15803D" text-anchor="middle">手机 ChatGPT 应用 · Remote 页</text></g><g data-reveal="0"><text x="830" y="110" style="font-family:'Course Sans',sans-serif" font-size="16" font-weight="400" fill="#243042" text-anchor="middle">离开电脑桌也能随时看进度，不必守在屏幕前</text></g><g data-reveal="1"><rect x="8" y="156" width="1102" height="112" rx="10" fill="#FFFDF7" stroke="#6E6043" stroke-width="2" stroke-dasharray="8 6" filter="url(#p-rough)"/></g><g data-reveal="1"><text x="28" y="185" style="font-family:'Course Title','Course Sans',sans-serif" font-size="20" font-weight="400" fill="#6E6043" text-anchor="start">通路 B：云端任务 ── 另一条独立执行通路（不要和桌面本机混为一谈）</text></g><g data-reveal="1"><rect x="28" y="198" width="356" height="54" rx="10" fill="#F2EDE1" stroke="#6E6043" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="1"><text x="206" y="231" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="700" fill="#6E6043" text-anchor="middle">云端托管运行环境</text></g><g data-reveal="1"><rect x="416" y="198" width="124" height="54" rx="10" fill="#FCE6DD" stroke="#D9481C" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="1"><text x="478" y="231" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="700" fill="#AC3615" text-anchor="middle">≠ 不同通路</text></g><g data-reveal="1"><rect x="572" y="198" width="516" height="54" rx="10" fill="#F2EDE1" stroke="#6E6043" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="1"><text x="830" y="231" style="font-family:'Course Sans',sans-serif" font-size="18" font-weight="400" fill="#243042" text-anchor="middle">云端任务列表（与桌面本机任务分属两条路）</text></g><g data-reveal="2"><rect x="8" y="282" width="1102" height="44" rx="10" fill="#E8EAEE" stroke="#243042" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="2"><text x="559" y="310" style="font-family:'Course Sans',sans-serif" font-size="17" font-weight="700" fill="#243042" text-anchor="middle">课堂边界：只点明「看的是哪一条任务通路」，不扩展成手机远程编码课；未核验时只留说明</text></g></svg>
