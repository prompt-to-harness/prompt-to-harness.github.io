<svg xmlns="http://www.w3.org/2000/svg" class="lesson-diagram" viewBox="0 0 1118 336" width="1118" height="336"><defs><marker id="rd-arrow-uat-recovery-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6573"/></marker></defs><g data-reveal="0"><rect x="8" y="10" width="1102" height="68" rx="10" fill="#F2EDE1" stroke="#6E6043" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="0"><text x="28" y="38" style="font-family:'Course Sans',sans-serif" font-size="19" font-weight="700" fill="#6E6043" text-anchor="start">自动检查汇总：lint · typecheck · node:test · build · 浏览器回归</text></g><g data-reveal="0"><text x="28" y="63" style="font-family:'Course Sans',sans-serif" font-size="16.5" font-weight="400" fill="#243042" text-anchor="start">能证明：约定命令全部跑过    |    不能代替：人在真实界面上的恢复路径操作与发布批准</text></g><g data-reveal="1"><rect x="8" y="92" width="1102" height="138" rx="10" fill="#FFFDF7" stroke="#243042" stroke-width="2.5" filter="url(#p-rough)"/></g><g data-reveal="1"><text x="26" y="120" style="font-family:'Course Title','Course Sans',sans-serif" font-size="19" font-weight="400" fill="#243042" text-anchor="start">人工 UAT 连续五步路径（按自己亲眼所见作答，不复述框架完成文案）</text></g><g data-reveal="1"><rect x="24" y="134" width="186" height="82" rx="10" fill="#E3F2E6" stroke="#15803D" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="1"><text x="117" y="165" style="font-family:'Course Title','Course Sans',sans-serif" font-size="18.5" font-weight="400" fill="#15803D" text-anchor="middle">1. 有效比较</text></g><g data-reveal="1"><text x="117" y="195" style="font-family:'Course Sans',sans-serif" font-size="16" font-weight="700" fill="#243042" text-anchor="middle">出新图 · 无提示</text></g><g data-reveal="1"><path d="M214 175L238 175" stroke="#243042" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-uat-recovery-chain)"/></g><g data-reveal="1"><rect x="242" y="134" width="186" height="82" rx="10" fill="#FCE6DD" stroke="#D9481C" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="1"><text x="335" y="165" style="font-family:'Course Title','Course Sans',sans-serif" font-size="18.5" font-weight="400" fill="#AC3615" text-anchor="middle">2. After 改 {</text></g><g data-reveal="1"><text x="335" y="195" style="font-family:'Course Sans',sans-serif" font-size="16" font-weight="700" fill="#243042" text-anchor="middle">留旧图 · 提示亮</text></g><g data-reveal="1"><path d="M432 175L456 175" stroke="#243042" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-uat-recovery-chain)"/></g><g data-reveal="1"><rect x="460" y="134" width="186" height="82" rx="10" fill="#FCE6DD" stroke="#D9481C" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="1"><text x="553" y="165" style="font-family:'Course Title','Course Sans',sans-serif" font-size="18.5" font-weight="400" fill="#AC3615" text-anchor="middle">3. Before 也改 {</text></g><g data-reveal="1"><text x="553" y="195" style="font-family:'Course Sans',sans-serif" font-size="16" font-weight="700" fill="#243042" text-anchor="middle">双侧错 · 提示在</text></g><g data-reveal="1"><path d="M650 175L674 175" stroke="#243042" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-uat-recovery-chain)"/></g><g data-reveal="1"><rect x="678" y="134" width="186" height="82" rx="10" fill="#FAD7C8" stroke="#D9481C" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="1"><text x="771" y="165" style="font-family:'Course Title','Course Sans',sans-serif" font-size="18.5" font-weight="400" fill="#AC3615" text-anchor="middle">4. 仅恢复 After</text></g><g data-reveal="1"><text x="771" y="195" style="font-family:'Course Sans',sans-serif" font-size="16" font-weight="700" fill="#243042" text-anchor="middle">提示不消失！</text></g><g data-reveal="1"><path d="M868 175L892 175" stroke="#243042" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-uat-recovery-chain)"/></g><g data-reveal="1"><rect x="896" y="134" width="186" height="82" rx="10" fill="#E3F2E6" stroke="#15803D" 