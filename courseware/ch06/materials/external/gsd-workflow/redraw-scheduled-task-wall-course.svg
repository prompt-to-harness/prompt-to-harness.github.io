<svg xmlns="http://www.w3.org/2000/svg" class="lesson-diagram" viewBox="0 0 1118 312" width="1118" height="312"><defs><marker id="rd-arrow-scheduled-task-wall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6573"/></marker></defs><g data-reveal="0"><rect x="8" y="20" width="294" height="272" rx="10" fill="#E0F3EF" stroke="#0B6B5F" stroke-width="2.5" filter="url(#p-rough)"/></g><g data-reveal="0"><text x="26" y="54" style="font-family:'Course Title','Course Sans',sans-serif" font-size="22" font-weight="400" fill="#0B6B5F" text-anchor="start">定时任务的两类触发</text></g><g data-reveal="0"><rect x="26" y="74" width="258" height="86" rx="10" fill="#FFFDF7" stroke="#0B6B5F" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="0"><text x="42" y="104" style="font-family:'Course Sans',sans-serif" font-size="19" font-weight="700" fill="#243042" text-anchor="start">按时间运行</text></g><g data-reveal="0"><text x="42" y="134" style="font-family:'Course Sans',sans-serif" font-size="16.5" font-weight="400" fill="#5B6573" text-anchor="start">每日 / 每周定时自动触发</text></g><g data-reveal="0"><rect x="26" y="176" width="258" height="94" rx="10" fill="#FFFDF7" stroke="#0B6B5F" stroke-width="2" filter="url(#p-rough)"/></g><g data-reveal="0"><text x="42" y="206" style="font-family:'Course Sans',sans-serif" font-size="19" font-weight="700" fill="#243042" text-anchor="start">按外部事件运行</text></g><g data-reveal="0"><text x="42" y="234" style="font-family:'Course Sans',sans-serif" font-size="16.5" font-weight="400" fill="#5B6573" text-anchor="start">Gmail · Slack · GitHub 等</text></g><g data-reveal="0"><text x="42" y="256" style="font-family:'Course Sans',sans-serif" font-size="15" font-weight="400" fill="#0B6B5F" text-anchor="start">事件源依套餐与版本而定</text></g><g data-reveal="1"><path d="M306 152L352 152" stroke="#0B6B5F" stroke-width="2.5" fill="none" marker-end="url(#rd-arrow-scheduled-task-wall)"/></g><g data-reveal="1"><rect x="356"