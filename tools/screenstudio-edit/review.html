<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>剪辑审阅</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f2;--fg:#202722;--sub:#5c685f;--panel:#fff;--line:#d6ddd7;--keep:#3d896a;--cut:#c55a40;--zoom:#7960af;--off:#d5dad6;--pause:#b5bdb6}
@media(prefers-color-scheme:dark){:root{--bg:#171d19;--fg:#e5ece6;--sub:#aab7ad;--panel:#202923;--line:#3e4c42;--keep:#60b58f;--cut:#ef8e73;--zoom:#b59bdf;--off:#39473c;--pause:#56675b}}
*{box-sizing:border-box}[hidden]{display:none!important}.filters{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px}.filters input{width:100%;padding:8px;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px}.filters select{display:block;margin-top:4px}.filters input{display:block;margin-top:4px}@media(max-width:480px){.filters{grid-template-columns:1fr}}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,sans-serif}main{max-width:1280px;margin:auto;padding:30px 28px 60px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px;margin:24px 0 10px}p{margin:8px 0}small,.muted{color:var(--sub)}button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--zoom);outline-offset:2px}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:default}select{max-width:100%;width:100%}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.legend{font-size:14px;gap:20px}.swatch{display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:2px}.legend span{white-space:nowrap}.keep{background:var(--keep)}.cut{background:var(--cut)}.zoom{background:var(--zoom)}.off{background:var(--off)}.pause{background:repeating-linear-gradient(135deg,var(--off),var(--off) 5px,var(--pause) 5px,var(--pause) 7px)}.track{position:relative;height:28px;background:var(--off);border-radius:5px;overflow:hidden;margin:10px 0 2px}.track button,.track .segment{position:absolute;top:0;height:100%;border:0;border-radius:0;padding:0;min-width:1px}.track button:hover,.track button:focus-visible{filter:brightness(1.2)}.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}.global{height:20px}.global button{background:var(--keep);opacity:.8}.global button.active{background:var(--zoom);opacity:1}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:24px;margin-top:22px}.video-wrap{min-width:0}video{width:100%;aspect-ratio:16/9;background:#111;border-radius:6px;display:block}audio{width:100%;margin-top:10px}.details{background:var(--panel);padding:20px;border-radius:8px;min-width:0}.details h2{margin:0 0 10px}.type{display:inline-block;border-bottom:3px solid var(--cut);padding-bottom:3px;font-size:14px}.type.is-zoom{border-color:var(--zoom)}.reason{font-size:17px}.quote{white-space:pre-wrap;border-left:3px solid var(--line);margin:12px 0;padding-left:12px;overflow-wrap:anywhere}.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;margin:14px 0}.facts dt{color:var(--sub)}.facts dd{margin:0;overflow-wrap:anywhere}.metrics{display:flex;gap:25px;flex-wrap:wrap;margin:12px 0}.metrics strong{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}.metrics small{display:block}.actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}.event-list{display:grid;gap:0}.event-item{display:grid;grid-template-columns:70px 160px minmax(0,1fr) auto;gap:14px;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 8px;background:transparent;width:100%;align-items:start}.event-item.active{background:var(--panel)}.event-item .label{font-size:13px;color:var(--sub)}.event-item .duration{font-variant-numeric:tabular-nums;white-space:nowrap}.event-item .content{overflow-wrap:anywhere}.event-item .marker{border-left:4px solid var(--cut);padding-left:9px}.event-item.is-zoom .marker{border-color:var(--zoom)}.output{height:36px}.output .cut{top:0;width:4px;z-index:2}.output .zoom{top:7px;height:22px;opacity:.85}.notice{color:var(--sub);font-size:14px}#issues{color:var(--cut)}details{margin-top:14px}summary{cursor:pointer}#context{white-space:pre-wrap;font-size:14px;color:var(--sub)}a{color:var(--fg)}.empty{padding:16px 0;color:var(--sub)}
@media(max-width:800px){main{padding:20px 16px}.layout{grid-template-columns:1fr}.event-item{grid-template-columns:65px 1fr auto}.event-item .content{grid-column:2 / 4;grid-row:2}.event-item .duration{grid-column:3;grid-row:1}.event-item .marker{grid-column:1;grid-row:1 / 3}.metrics{gap:18px}h1{font-size:24px}}
</style>
<main>
<small id="source"></small><h1>剪辑审阅</h1>
<p class="notice">点击删除区间或放大事件，查看内容、原因和时间；可跳到成片接缝，并回听被删原音。记录不等于已完成听音校对。</p>
<p id="scope-summary" class="notice"></p><section id="global-block"><h2>全片定位 · 本批示例覆盖范围</h2>
<div id="global" class="track global" aria-label="整段录制中的示例位置"></div><div class="ticks"><span>00:00</span><span id="full-end"></span></div>
<p class="notice" id="global-caption"></p></section>
<div class="row legend"><span><i class="swatch keep"></i>保留</span><span><i class="swatch cut"></i>实际删除</span><span><i class="swatch zoom"></i>放大</span><span id="outside-legend"><i class="swatch off"></i>示例外未覆盖</span><span><i class="swatch pause"></i>录制暂停</span></div>
<div id="clip-wrap"><h2><label for="clip">审阅示例</label></h2><select id="clip"></select></div><div id="chapter-wrap" hidden><h2><label for="chapter">按讲述段落定位</label></h2><select id="chapter"></select></div>
<div class="metrics" id="metrics"></div>
<div id="issues" role="status"></div>
<h2>原片区间</h2><div id="source-track" class="track" aria-label="本示例源区间的保留和删除"></div><div class="ticks"><span id="source-start"></span><span id="source-end"></span></div>
<p class="notice">占比只按当前审阅范围内实际录到的媒体计算；暂停不计入删除。极短删词请点下方清单。</p>
<h2>成片时间线 · 接缝与放大</h2><div id="output-track" class="track output" aria-label="成片中的接缝与放大"></div><div class="ticks"><span>00:00</span><span id="film-end"></span></div>
<div class="layout"><div class="video-wrap"><video id="video" controls preload="metadata" playsinline></video><p id="play-state" class="notice" role="status"></p><p id="zoom-policy" class="notice"></p></div>
<section class="details" aria-live="polite"><div id="event-type" class="type"></div><h2 id="event-title"></h2><p id="reason" class="reason"></p><div id="quote" class="quote"></div><dl id="facts" class="facts"></dl><div class="actions"><button id="seam" type="button">播放接缝前后</button><button id="raw" type="button">听被删原音</button></div><audio id="audio" controls hidden preload="none"></audio><p id="audio-state" class="notice" role="status"></p><details id="context-wrap"><summary>查看附近转写（含未删除部分）</summary><p id="context"></p></details></section></div>
<h2>逐条记录</h2><div class="filters"><label>事件类型<select id="event-kind" aria-label="事件类型"><option value="all">全部事件</option><option value="cut">只看删除</option><option value="zoom">只看放大</option></select></label><label>查找内容或原因<input type="search" id="search" aria-label="查找内容或原因" placeholder="例如：口水词、源码、轮次、数字"></label></div><p class="notice" id="filtered-count"></p><div id="events" class="event-list"></div>
<p class="notice" id="scope-note">绿色区间被保留；灰色区间不代表最终课程要删除。各示例独立统计，不能相加当作整节成片。审阅文件只读，不会修改剪辑计划。</p>
</main>
<script>
const DATA=/*REVIEW_DATA*/null;
const $=id=>document.getElementById(id);
const fmt=n=>{let ms=Math.round(n*1000),s=Math.floor(ms/1000);return `${Math.floor(s/3600).toString().padStart(2,'0')}:${Math.floor(s/60)%60<10?'0':''}${Math.floor(s/60)%60}:${(s%60).toString().padStart(2,'0')}.${(ms%1000).toString().padStart(3,'0')}`};
const duration=n=>DATA.scope==='lesson'?`${Math.floor(n/60)}分${(n%60).toFixed(3)}秒`:n.toFixed(3)+' 秒';
const text=(id,s)=>{$(id).textContent=s};
let clipIndex=DATA?Math.max(0,DATA.clips.findIndex(c=>c.events.some(e=>e.kind==='cut'))):0,selected=null,audioStop=null;
function mediaURL(key){return location.protocol==='http:'||location.protocol==='https:'?'/media/'+encodeURIComponent(key):DATA.media[key].relative}
function segment(track,start,end,origin,duration,cls,label,action){const e=document.createElement(action?'button':'span');e.className=action?cls:'segment '+cls;e.style.left=((start-origin)/duration*100)+'%';e.style.width=((end-start)/duration*100)+'%';if(action){e.type='button';e.setAttribute('aria-label',label);e.title=label;e.onclick=action}else e.setAttribute('aria-hidden','true');track.appendChild(e);return e}
function jump(at,play=true){const v=$('video');const seek=()=>{v.currentTime=Math.max(0,at);if(play)v.play().catch(()=>text('play-state','请点击播放器播放。'))};if(v.readyState)seek();else v.addEventListener('loadedmetadata',seek,{once:true})}
function showEvent(e){selected=e;const zoom=e.kind==='zoom';text('event-type',zoom?'局部放大 · '+e.category:'已执行删除 · '+e.category);$('event-type').classList.toggle('is-zoom',zoom);text('event-title',e.id+' · '+(zoom?e.text:`删去 ${e.seconds.toFixed(3)} 秒`));text('reason',e.reason);text('quote',e.text);const facts=[['原片时间',fmt(e.start)+' — '+fmt(e.end)],[zoom?'成片放大':'成片接缝',fmt(e.at)+(zoom?' — '+fmt(e.output_end):'')],['校对状态',e.status]];if(zoom)facts.push(['倍率／目标',e.scale+'× · '+e.target.join(', ')]);if(e.source_ids.length)facts.push(['源段',e.source_ids.join('、')]);if(e.retained)facts.push(['保留替代',e.retained]);$('facts').replaceChildren();for(const [k,v] of facts){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;$('facts').append(dt,dd)}text('context',e.context||'未提供附近转写');$('context-wrap').hidden=!e.context;$('raw').hidden=zoom;text('seam',zoom?'播放放大效果':'播放接缝前后');$('audio').onloadedmetadata=null;$('audio').pause();$('audio').hidden=true;audioStop=null;text('audio-state','');for(const row of $('events').children)row.classList.toggle('active',row.dataset.event===e.id)}
function filterEvents(){const query=$('search').value.trim().toLowerCase(),kind=$('event-kind').value;let shown=0;for(const row of $('events').children){row.hidden=(kind!=='all'&&row.dataset.kind!==kind)||(query&&!row.dataset.search.includes(query));if(!row.hidden)shown++}const visible=Array.from($('events').children).filter(row=>!row.hidden);if(visible.length&&!visible.some(row=>selected&&row.dataset.event===selected.id))showEvent(DATA.clips[clipIndex].events.find(e=>e.id===visible[0].dataset.event));text('filtered-count',`显示 ${shown} / ${DATA.clips[clipIndex].events.length} 条事件`)}
function renderChapters(c){$('chapter-wrap').hidden=!(c.chapters&&c.chapters.length);$('chapter').replaceChildren();let first=document.createElement('option');first.value='';first.textContent='选择段落，跳到成片位置';$('chapter').appendChild(first);for(const x of c.chapters||[]){let option=document.createElement('option');option.value=x.at;option.textContent=fmt(x.at)+' · '+x.title;$('chapter').appendChild(option)}$('event-kind').value='all';$('search').value=''}
function render(){const c=DATA.clips[clipIndex];renderChapters(c);$('video').pause();$('audio').onloadedmetadata=null;$('audio').pause();$('video').src=mediaURL(c.media);text('play-state',c.rendered?(c.validation_ok?'已导出；媒体规格检查通过。接缝听感请人工确认。':'文件存在；未附通过的媒体检查记录。'):'成片尚未导出，当前仅有剪辑计划。');text('zoom-policy',DATA.zoom_policy);$('metrics').replaceChildren();for(const [label,value]of [['保留',duration(c.kept_seconds)],['删除',duration(c.cut_seconds)],['范围内删除占比',c.cut_percent.toFixed(1)+'%'],['放大次数',c.events.filter(e=>e.kind==='zoom').length]]){let box=document.createElement('div'),strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=value;small.textContent=label;box.append(strong,small);$('metrics').appendChild(box)}const [a,b]=c.window;$('source-track').replaceChildren();segment($('source-track'),a,b,a,b-a,'pause','',null);for(const [x,y]of c.kept)segment($('source-track'),x,y,a,b-a,'keep','保留 '+fmt(x)+' — '+fmt(y),()=>jump(c.kept.reduce((n,[u,v])=>n+Math.max(0,Math.min(v,x)-u),0),false));for(const e of c.events.filter(e=>e.kind==='cut'))segment($('source-track'),e.start,e.end,a,b-a,'cut',e.id+' '+e.text,()=>showEvent(e));text('source-start',fmt(a));text('source-end',fmt(b));text('film-end',fmt(c.kept_seconds));$('output-track').replaceChildren();segment($('output-track'),0,c.kept_seconds,0,c.kept_seconds,'keep','',null);for(const e of c.events){let mark=segment($('output-track'),e.at,e.kind==='zoom'?e.output_end:e.at,0,c.kept_seconds,e.kind,e.id+' '+e.text,()=>{showEvent(e);jump(Math.max(0,e.at-2),false)});if(e.kind==='cut'){mark.style.width='4px';mark.style.minWidth='4px'}}$('events').replaceChildren();for(const e of c.events){let row=document.createElement('button');row.className='event-item'+(e.kind==='zoom'?' is-zoom':'');row.type='button';row.dataset.event=e.id;row.dataset.kind=e.kind;row.dataset.search=(e.id+' '+e.text+' '+e.reason+' '+e.category+' '+e.source_ids.join(' ')).toLowerCase();for(const [cls,val]of [['marker',e.id+'\n'+e.category],['label',fmt(e.start)+'\n成片 '+fmt(e.at)],['content',e.text+'\n'+e.reason],['duration',e.seconds.toFixed(3)+' 秒']]){let span=document.createElement('span');span.className=cls;span.textContent=val;span.style.whiteSpace=cls==='content'?'normal':'pre-line';row.appendChild(span)}row.onclick=()=>showEvent(e);$('events').appendChild(row)}for(const mark of $('global').querySelectorAll('button'))mark.classList.toggle('active',+mark.dataset.index===clipIndex);if(c.events.length)showEvent(c.events.find(e=>e.kind==='cut'&&!['首尾空白','口水词','长等待精简'].includes(e.category))||c.events[0]);else{selected=null;text('event-type','没有删除或放大事件');text('event-title','当前示例完整保留');text('reason','这组用于核对固定布局与镜像。');text('quote','');$('facts').replaceChildren();$('seam').disabled=true;$('raw').hidden=true;$('context-wrap').hidden=true;$('audio').hidden=true}if(c.events.length)$('seam').disabled=false;filterEvents()}
$('seam').onclick=()=>{$('audio').pause();if(selected)jump(Math.max(0,selected.at-2))};
$('raw').onclick=()=>{if(!selected)return;$('video').pause();const a=DATA.audio.find(a=>selected.start>=a.start-.001&&selected.start<a.end);if(!a){text('audio-state','没有找到对应原音轨');return}const player=$('audio');player.hidden=false;player.src=mediaURL(a.media);audioStop=Math.min(a.end,selected.end+.25)-a.start;player.preload='metadata';const event=selected;player.onloadedmetadata=()=>{player.currentTime=Math.max(0,event.start-a.start-.25);player.play().catch(()=>text('audio-state','请点击原音播放器播放。'))};player.load();text('audio-state','原音回听：'+fmt(selected.start)+' — '+fmt(selected.end)+'，前后各留约 0.25 秒。')};
$('audio').addEventListener('timeupdate',()=>{if(audioStop!==null&&$('audio').currentTime>=audioStop)$('audio').pause()});
$('video').addEventListener('error',()=>text('play-state','视频未加载。请在本机打开 HTML；若浏览器限制本地媒体，请用 serve_review.py 启动本地审阅。'));
$('audio').addEventListener('error',()=>text('audio-state','原音未加载。请确认原项目仍在原位置，或使用本地审阅服务器。'));
$('chapter').onchange=()=>{if($('chapter').value!=='')jump(+$('chapter').value,false)};$('event-kind').onchange=filterEvents;$('search').oninput=filterEvents;
if(DATA){if(DATA.scope==='lesson'){$('outside-legend').hidden=true;$('source-track').setAttribute('aria-label','完整小节源区间的保留和删除');$('global-block').hidden=true;$('clip-wrap').hidden=true;text('scope-summary',`完整小节 · 原时间线 ${fmt(DATA.source_end)}，其中实际录制 ${(DATA.recorded_seconds/60).toFixed(1)} 分钟、暂停 ${(DATA.pause_seconds/60).toFixed(1)} 分钟；删除统计只计算实际媒体。`);text('scope-note','本页覆盖完整小节：删除条目均对应实际切片；录制暂停不计为内容删除。按讲述段落跳转成片，或在逐条清单中查找内容和原因。')}text('source',DATA.source_name);text('full-end',fmt(DATA.source_end));text('global-caption',`原时间线 ${fmt(DATA.source_end)}；实际录制 ${(DATA.recorded_seconds/60).toFixed(1)} 分钟，暂停 ${(DATA.pause_seconds/60).toFixed(1)} 分钟。以下 ${DATA.clips.length} 组是独立示例，不是整节删除统计。`);text('issues',DATA.issues.join('；'));let previous=0;for(const [a,b]of DATA.recorded_ranges){if(a>previous)segment($('global'),previous,a,0,DATA.source_end,'pause','',null);previous=b}for(const [i,c]of DATA.clips.entries()){let option=document.createElement('option');option.value=i;option.textContent=c.name;$('clip').appendChild(option);let mark=segment($('global'),c.window[0],c.window[1],0,DATA.source_end,'',c.name,()=>{$('clip').value=i;clipIndex=i;render()});mark.dataset.index=i}$('clip').onchange=()=>{clipIndex=+$('clip').value;render()};$('clip').value=clipIndex;render()}
</script>
</html>
