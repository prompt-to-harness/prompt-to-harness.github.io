<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆翻牌</title>
<style>html,body{margin:0;width:100%;height:100%;background:#faf9f6}iframe{display:block;width:100%;height:100%;border:0;visibility:hidden}#status{position:fixed;inset:24px auto auto 24px;font:16px/1.6 system-ui;color:#33483c}</style></head>
<body><p id="status" role="status">正在打开游戏…</p><iframe title="记忆翻牌游戏"></iframe>
<script>
const games={a1:'#memory',a2:'#game',b2:'#game',old5:'#memory',f1:'#game','mm-memory':'main.app'};
let displayName='记忆翻牌';
fetch('case-map.json').then(r=>r.json()).then(data=>{const item=data.cases.find(x=>x.archive_id===id);if(item){displayName=item.display_id+' 号游戏';document.title=displayName;frame.title=displayName;if(frame.contentDocument)frame.contentDocument.title=displayName;}});
const id=new URLSearchParams(location.search).get('run');
const frame=document.querySelector('iframe'),status=document.querySelector('#status');
if(!Object.hasOwn(games,id)){
  status.textContent='未找到这个游戏，请返回成品概览重新打开';
}else{
  frame.addEventListener('load',()=>{
    const doc=frame.contentDocument;
    let attempts=0;
    const prepare=()=>{
      const game=doc.querySelector(games[id]);
      if(!game){
        if(++attempts<100)return setTimeout(prepare,100);
        status.textContent='游戏未加载成功，请刷新后重试';return;
      }
      if(id!=='mm-memory'){
        const style=doc.createElement('style');
        style.textContent=`body{padding:24px!important;gap:0!important}#root{width:100%;margin:0!important;padding:0!important}#root>:not(${games[id]}){display:none!important}${games[id]}{margin:0 auto!important;padding-top:0!important;border-top:0!important}`;
        doc.head.append(style);
      }
      doc.title=displayName;
      doc.defaultView.scrollTo(0,0);
      frame.style.visibility='visible';status.remove();
    };
    prepare();
  });
  frame.src='games/'+id+'/index.html';
}
</script></body></html>
