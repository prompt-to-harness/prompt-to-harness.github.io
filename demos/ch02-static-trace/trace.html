  if (gapMs < 3600000) label = Math.round(gapMs / 60000) + ' min gap';
  else label = (gapMs / 3600000).toFixed(1) + ' hr gap';
  return `<div class="time-gap"><span class="tg-line"></span>${label}<span class="tg-line"></span></div>`;
}

/* ─── Position indicator ─── */
function updatePositionIndicator() {
  const pi = $('#position-indicator');
  if (!pi) return;
  if (!filtered.length || activeIdx < 0) {
    pi.style.display = 'none';
    return;
  }
  pi.style.display = 'flex';
  const entry = filtered[activeIdx];
  const turnNum = displayTurnLabel(entry);
  const pos = activeIdx + 1;
  const total = filtered.length;
  const pct = total > 1 ? ((pos - 1) / (total - 1)) * 100 : 0;
  $('#pi-current').textContent = turnNum;
  $('#pi-total').textContent = `of ${total}`;
  $('#pi-fill').style.width = pct + '%';
}

/* ─── Virtual scroll ─── */
let _vsRafPending = false;

function vsInitSidebar(sb, prevScrollTop, preserveDetail) {
  sb.innerHTML = '';
  const spacer = document.createElement('div');
  spacer.className = 'vs-spacer';
  spacer.style.height = (vsFilteredItems.length * VS_ITEM_HEIGHT) + 'px';
  sb.appendChild(spacer);

  // Throttled scroll handler
  sb.onscroll = () => {
    if (!_vsRafPending) {
      _vsRafPending = true;
      requestAnimationFrame(() => {
        _vsRafPending = false;
        vsRenderVisible();
      });
    }
  };

  if (preserveDetail) sb.scrollTop = prevScrollTop;
  vsRenderVisible();
  _restoreSelection(preserveDetail);
}

function vsRenderVisible() {
  const sb = $('#sidebar');
  if (!sb) return;
  const spacer = sb.querySelector('.vs-spacer');
  if (!spacer) return;

  const scrollTop = sb.scrollTop;
  const viewHeight = sb.clientHeight;
  const startIdx = Math.max(0, Math.floor(scrollTop / VS_ITEM_HEIGHT) - VS_BUFFER);
  const endIdx = Math.min(vsFilteredItems.length, Math.ceil((scrollTop + viewHeight) / VS_ITEM_HEIGHT) + VS_BUFFER);

  spacer.querySelectorAll('.sidebar-item, .sidebar-group-header').forEach(el => el.remove());

  for (let i = startIdx; i < endIdx; i++) {
    const row = vsFilteredItems[i];
    let item;
    if (row.type === 'group') {
      item = createSessionGroupHeader(row.group, row.groupIdx, row.groupKey, () => {
        if (collapsedGroups.has(row.groupKey)) collapsedGroups.delete(row.groupKey);
        else collapsedGroups.add(row.groupKey);
        renderSidebar(true);
        updateMobileNav();
      });
    } else {
      const { entry, idx } = row;
      item = createSidebarItem(entry, idx);
      item.classList.toggle('active', idx === activeIdx);
    }
    item.style.position = 'absolute';
    item.style.left = '0';
    item.style.right = '0';
    item.style.top = (i * VS_ITEM_HEIGHT) + 'px';
    item.style.height = VS_ITEM_HEIGHT + 'px';
    spacer.appendChild(item);
  }
}

function vsScrollToIdx(idx) {
  const sb = $('#sidebar');
  if (!sb || !virtualMode) return;
  const pos = vsFilteredItems.findIndex(item => item.idx === idx);
  if (pos < 0) return;
  const itemTop = pos * VS_ITEM_HEIGHT;
  const itemBottom = itemTop + VS_ITEM_HEIGHT;
  if (itemTop < sb.scrollTop) {
    sb.scrollTop = itemTop;
  } else if (itemBottom > sb.scrollTop + sb.clientHeight) {
    sb.scrollTop = itemBottom - sb.clientHeight;
  }
}

function selectEntry(idx, opts) {
  if (idx < 0 || idx >= filtered.length) return;
  const force = !opts || opts.force !== false;
  const entry = filtered[idx];
  const entryKey = entryStableKey(entry);
  activeIdx = idx;
  if (virtualMode) {
    vsRenderVisible();
  } else {
    document.querySelectorAll('.sidebar-item').forEach(el => {
      el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
    });
  }
  // Skip re-render if same entry and force=false (preserves scroll position in live mode)
  if (!force && currentDetailEntryKey === entryKey) {
    // Just update sidebar highlight, keep detail as-is
  } else {
    renderDetailForEntry(entry);
  }
  if (virtualMode) {
    vsScrollToIdx(idx);
  } else {
    const active = document.querySelector('.sidebar-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }
  updatePositionIndicator();
  mobileShowDetail();
  updateMobileNav();
}

/* ─── Detail ─── */
// Persist section collapse state across turn switches.
// Key: section title text, Value: true = open, false = collapsed.
const sectionCollapseState = {};
let detailViewMode = 'default';
let traceFormatMode = 'json';
let detailLoadToken = 0;

function saveSectionStates() {
  const d = $('#detail');
  if (!d) return;
  d.querySelectorAll('.section').forEach(sec => {
    const titleEl = sec.querySelector('.section-header .title');
    const bodyEl = sec.querySelector('.section-body');
    if (titleEl && bodyEl) {
      sectionCollapseState[titleEl.textContent] = bodyEl.classList.contains('open');
    }
  });
}

function restoreSectionStates() {
  const d = $('#detail');
  if (!d) return;
  d.querySelectorAll('.section').forEach(sec => {
    const titleEl = sec.querySelector('.section-header .title');
    const bodyEl = sec.querySelector('.section-body');
    const chevron = sec.querySelector('.chevron');
    if (!titleEl || !bodyEl || !chevron) return;
    const key = titleEl.textContent;
    if (key in sectionCollapseState) {
      const shouldBeOpen = sectionCollapseState[key];
      if (shouldBeOpen && !bodyEl.classList.contains('open')) {
        bodyEl.classList.add('open');
        chevron.classList.add('open');
      } else if (!shouldBeOpen && bodyEl.classList.contains('open')) {
        bodyEl.classList.remove('open');
        chevron.classList.remove('open');
      }
    }
  });
}

function setDetailViewMode(mode) {
  detailViewMode = mode;
  const entry = filtered[activeIdx];
  if (!entry) return;
  renderDetailForEntry(entry);
}

function detailTabButton(mode, label) {
  const active = detailViewMode === mode;
  return `<button type="button" role="tab" aria-selected="${active ? 'true' : 'false'}" data-tab="${mode}" class="detail-tab ${active ? 'active' : ''}" onclick="setDetailViewMode('${mode}')"><span>${esc(label)}</span></button>`;
}

function renderDetailViewTabs() {
  return `<div class="detail-inspector-bar" role="tablist" aria-label="Detail view mode"><div class="detail-tabs">
    ${detailTabButton('default', t('tab_default'))}
    ${detailTabButton('trace', t('tab_trace'))}
  </div></div>`;
}

function setTraceFormatMode(mode) {
  if (!['json', 'yaml', 'pretty'].includes(mode)) return;
  traceFormatMode = mode;
  const entry = filtered[activeIdx];
  if (!entry) return;
  renderDetailForEntry(entry);
}

function renderTraceFormatControls() {
  const modes = [
    ['json', t('format_json')],
    ['yaml', t('format_yaml')],
    ['pretty', t('format_pretty')],
  ];
  return `<div class="trace-format-bar" role="toolbar" aria-label="Trace format">${modes.map(([mode, label]) => {
    const active = traceFormatMode === mode;
    return `<button type="button" data-format="${mode}" class="trace-format-btn ${active ? 'active' : ''}" aria-pressed="${active ? 'true' : 'false'}" onclick="setTraceFormatMode('${mode}')">${esc(label)}</button>`;
  }).join('')}</div>`;
}

async function renderDetailForEntry(entry) {
  if (!shouldFetchRemoteEntry(entry)) {
    renderDetail(resolveEntryForDetail(entry));
    return;
  }
  const token = ++detailLoadToken;
  currentDetailRequestId = entry.request_id;
  currentDetailEntryKey = entryStableKey(entry);
  $('#detail').innerHTML = '<div class="empty-state" role="status" aria-live="polite"></div>';
  try {
    const resolved = await resolveEntryForDetailAsync(entry);
    if (token !== detailLoadToken) return;
    renderDetail(resolved);
  } catch (err) {
    console.error('Failed to load trace record:', err);
    if (token !== detailLoadToken) return;
    renderDetail(resolveEntryForDetail(entry));
  }
}

function renderDetail(e) {
  saveSectionStates();
  currentDetailRequestId = e.request_id;
  currentDetailEntryKey = entryStableKey(e);
  const d = $('#detail');
  const reqBody = e.request?.body, respBody = e.response?.body, usage = getUsage(e);
  const statusCode = getResponseStatus(e);
  const isError = statusCode >= 400;
  const errorMessage = getResponseErrorMessage(e);
  let html = '';

  if (isError) {
    html += `<div class="error-banner"><div class="eb-icon">&#9888;</div><div class="eb-content"><div class="eb-title">HTTP ${statusCode}</div><div class="eb-message">${esc(errorMessage)}</div></div></div>`;
  }
  const continuation = getResponsesContinuationInfo(e);
  if (continuation) html += renderResponsesContinuationNotice(continuation);

  const sysPrompt = extractSystem(reqBody);
  const sysBlocks = extractSystemBlocks(reqBody);
  const respOutput = getResponseOutput(e);
  const respPayload = getResponsePayload(e);
  const tools = getDetailTools(e, reqBody, respPayload);
  const msgs = getMessages(reqBody);
  const contextOnly = shouldRenderRequestContext(e, reqBody, msgs, respOutput);
  const streamEvents = getResponseEvents(e);
  html += renderDetailViewTabs();

  if (detailViewMode === 'default') {
    const actionBarHtml = `<div class="action-bar">
      <button class="act-btn" onclick="copyRequestBody(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>${t('btn_request_json')}</button>
      <button class="act-btn" onclick="copyCurl(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>${t('btn_curl')}</button>
      <button class="act-btn" onclick="showDiff(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/><path d="M3 6h18M3 18h18" opacity=".4"/></svg>${t('btn_diff')}</button>
    </div>`;
    const toolsSection = tools && tools.length
      ? section(t('section_tools'), renderTools(tools), false, null, tools.length + ' ' + t('badge_tools'))
      : '';
    const systemSection = sysPrompt ? section(t('section_system'), renderSystemPrompt(sysBlocks, sysPrompt), true, sysPrompt) : '';
    const messagesSection = msgs && msgs.length
      ? section(contextOnly ? t('section_context') : t('section_messages'), renderMessages(msgs), true, null, msgs.length + ' ' + t('badge_messages'))
      : '';
    const responseSection = respOutput?.content || contextOnly
      ? section(t('section_response'), renderResponseContent(respOutput, contextOnly), true)
      : '';
    const streamSection = streamEvents.length
      ? section(t('section_sse'), renderSSEEvents(streamEvents), false, null, streamEvents.length + ' ' + t('badge_events'))
      : '';
    const jsonSection = section(t('section_json'), `<div class="json-view">${renderJSONTree(e)}</div>`, false, JSON.stringify(e, null, 2));
    html += actionBarHtml;
    if (usage) html += renderTokenUsage(usage);
    html += renderCacheDiagnostic(e);
    html += toolsSection + systemSection + messagesSection + responseSection;
    if (streamEvents.length) html += streamSection;
    html += jsonSection;
  } else if (detailViewMode === 'trace') {
    html += renderTraceDetail(e, { reqBody, sysPrompt, msgs, tools, respOutput, contextOnly, streamEvents, usage });
  }

  d.innerHTML = html;
  bindSections(d);
  restoreSectionStates();
  // Dashboard mode renders the cache card before its predecessor is available.
  if (typeof upgradeCacheDiagnostic === 'function') upgradeCacheDiagnostic(e, d);
  if (globalSearchState.open && globalSearchState.query) {
    const target = getTargetForGlobalMatch(globalSearchState.currentMatch);
    const localIndex = target && target.entryKey === entryStableKey(e) ? target.localIndex : 0;
    applyGlobalSearchHighlights(localIndex);
  }
}

function renderTraceBlock(title, payload, badge = '') {
  const badgeHtml = badge ? `<span class="trace-badge">${esc(badge)}</span>` : '';
  const copyText = tracePayloadText(payload);
  const copyBtn = `<button class="trace-copy-btn" type="button" data-copy="${encodeCopyText(copyText)}">${t('copy')}</button>`;
  return `<div class="trace-block"><div class="trace-block-title"><span class="trace-title">${esc(title)}</span><span class="trace-actions">${badgeHtml}${copyBtn}</span></div>${renderTracePayload(payload)}</div>`;
}

function renderTraceDetail(entry, ctx) {
  const inputPayload = {
    system: ctx.sysPrompt || undefined,
    messages: ctx.msgs || [],
    tools: ctx.tools || [],
  };
  const responsePayload = {
    status: getResponseStatus(entry),
    output: ctx.respOutput?.content || [],
    usage: ctx.usage || {},
    body: getResponsePayload(entry) || {},
  };
  const metadata = {
    request_id: entry.request_id || '',
    display_turn: entry.display_turn ?? '',
    capture_turn: entry.capture_turn ?? entry.turn ?? '',
    turn: entry.turn ?? '',
    record_index: entry.record_index ?? '',
    websocket_response_index: entry.websocket_response_index ?? '',
    duration_ms: entry.duration_ms ?? 0,
    transport: entry.transport || 'http',
    upstream_base_url: entry.upstream_base_url || '',
    method: entry.request?.method || '',
    path: entry.request?.path || '',
    model: ctx.reqBody?.model || '',
    status: getResponseStatus(entry),
  };

  let html = renderTraceFormatControls();
  if (ctx.usage) html += renderTokenUsage(ctx.usage);
  html += renderCacheDiagnostic(entry);
  html += '<div class="trace-grid">';
  html += renderTraceBlock(
    t('tok_input'),
    inputPayload,
    `${(ctx.msgs || []).length} ${t('badge_messages')}`
  );
  html += renderTraceBlock(
    t('tok_output'),
    responsePayload,
    `${getResponseStatus(entry)}`
  );
  if (ctx.streamEvents.length) {
    html += renderTraceBlock(
      t('section_sse'),
      ctx.streamEvents,
      `${ctx.streamEvents.length} ${t('badge_events')}`
    );
  }
  html += renderTraceBlock(
    t('section_metadata'),
    metadata
  );
  html += '</div>';
  return html;
}

function renderTracePayload(payload) {
  if (traceFormatMode === 'pretty') return `<div class="trace-pretty">${renderTracePrettyValue(payload)}</div>`;
  const text = traceFormatMode === 'yaml' ? toTraceYaml(payload) : JSON.stringify(payload, null, 2);
  return `<pre class="trace-code" data-format="${traceFormatMode}">${esc(text)}</pre>`;
}

function tracePayloadText(payload) {
  return traceFormatMode === 'yaml' ? toTraceYaml(payload) : JSON.stringify(payload, null, 2);
}

function isTraceScalar(value) {
  return value === null || value === undefined || typeof value !== 'object';
}

function yamlKey(key) {
  return /^[A-Za-z_][A-Za-z0-9_-]*$/.test(key) ? key : JSON.stringify(key);
}

function yamlScalar(value, indent) {
  if (value === null || value === undefined) return 'null';
  if (typeof value === 'number' || typeof value === 'boolean') return String(value);
  const str = String(value);
  if (str === '') return '""';
  if (str.includes('\n')) {
    const pad = ' '.repeat(indent + 2);
    return `|\n${str.split('\n').map(line => pad + line).join('\n')}`;
  }
  if (/^[A-Za-z0-9_./:@+-]+$/.test(str) && !/^(true|false|null|yes|no|on|off)$/i.test(str)) return str;
  return JSON.stringify(str);
}

function toTraceYaml(value, indent = 0) {
  const pad = ' '.repeat(indent);
  if (isTraceScalar(value)) return pad + yamlScalar(value, indent);
  if (Array.isArray(value)) {
    if (!value.length) return pad + '[]';
    return value.map(item => {
      if (isTraceScalar(item)) return `${pad}- ${yamlScalar(item, indent)}`;
      return `${pad}-\n${toTraceYaml(item, indent + 2)}`;
    }).join('\n');
  }
  const keys = Object.keys(value).filter(key => value[key] !== undefined);
  if (!keys.length) return pad + '{}';
  return keys.map(key => {
    const item = value[key];
    if (isTraceScalar(item)) return `${pad}${yamlKey(key)}: ${yamlScalar(item, indent)}`;
    return `${pad}${yamlKey(key)}:\n${toTraceYaml(item, indent + 2)}`;
  }).join('\n');
}

function renderTracePrettyScalar(value) {
  if (value === null || value === undefined) return `<span class="trace-value">${value === undefined ? 'undefined' : 'null'}</span>`;
  if (typeof value === 'number' || typeof value === 'boolean') return `<span class="trace-value">${esc(String(value))}</span>`;
  const str = String(value);
  if (str.length > 90 || str.includes('\n')) return `<pre class="trace-string-block">${esc(str)}</pre>`;
  return `<span class="trace-value">${esc(JSON.stringify(str))}</span>`;
}

function renderTracePrettyValue(value, depth = 0) {
  if (isTraceScalar(value)) return renderTracePrettyScalar(value);
  if (Array.isArray(value)) {
    if (!value.length) return '<div class="trace-empty">[]</div>';
    return `<div class="trace-pretty-array">${value.map((item, index) => `<div class="trace-array-item"><span class="trace-index">#${index}</span>${renderTracePrettyValue(item, depth + 1)}</div>`).join('')}</div>`;
  }
  const keys = Object.keys(value).filter(key => value[key] !== undefined);
  if (!keys.length) return '<div class="trace-empty">{}</div>';
  return `<div class="trace-pretty-object">${keys.map(key => {
    const item = value[key];
    if (isTraceScalar(item)) return `<div class="trace-kv"><span class="trace-key">${esc(key)}</span>${renderTracePrettyScalar(item)}</div>`;
    return `<div class="trace-nested"><div class="trace-nested-title">${esc(key)}</div>${renderTracePrettyValue(item, depth + 1)}</div>`;
  }).join('')}</div>`;
}

/* ─── Renderers ─── */
function chatMessageContentToText(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    return content.map(part => {
      if (typeof part === 'string') return part;
      if (!part || typeof part !== 'object') return '';
      if (part.type === 'text' || part.type === 'input_text' || part.type === 'output_text') return part.text || '';
      if (typeof part.text === 'string') return part.text;
      return JSON.stringify(part);
    }).filter(Boolean).join('\n');
  }
  if (content === undefined || content === null) return '';
  return JSON.stringify(content);
}

function normalizeDisplayContentBlocks(content) {
  if (typeof content === 'string') return content.trim() ? [{ type: 'text', text: content }] : [];
  if (content === undefined || content === null) return [];
  if (!Array.isArray(content)) return [{ type: 'raw', value: content }];
  return content.map(block => {
    if (typeof block === 'string') return { type: 'text', text: block };
    if (!block || typeof block !== 'object') return { type: 'raw', value: block };
    return block;
  }).filter(block => hasDisplayContent([block]));
}

function isChatInstructionRole(role) {
  return role === 'system' || role === 'developer';
}

function chatInstructionMessages(body) {
  if (!Array.isArray(body?.messages)) return [];
  return body.messages.filter(m => m && isChatInstructionRole(m.role));
}

function parseToolCallArguments(args) {
  if (args === undefined || args === null || args === '') return {};
  if (typeof args !== 'string') return args;
  try { return JSON.parse(args); } catch(e) { return args; }
}

function chatToolCallToContentBlock(call) {
  const fn = call?.function || {};
  return {
    type: 'tool_use',
    id: call?.id || '',
    name: fn.name || call?.name || 'tool_use',
    input: parseToolCallArguments(fn.arguments),
  };
}

function normalizeChatMessageForDisplay(msg) {
  if (!msg || typeof msg !== 'object') return { role: 'unknown', content: '' };
  const role = msg.role || 'unknown';
  if (role === 'tool') {
    return {
      ...msg,
      content: [{ type: 'tool_result', tool_use_id: msg.tool_call_id || '', content: msg.content || '' }],
    };
  }
  const content = [];
  if (Array.isArray(msg.content)) content.push(...msg.content);
  else if (typeof msg.content === 'string') {
    if (msg.content.trim()) content.push({ type: 'text', text: msg.content });
  } else if (msg.content !== undefined && msg.content !== null) {
    content.push(msg.content);
  }
  if (Array.isArray(msg.tool_calls)) {
    content.push(...msg.tool_calls.map(chatToolCallToContentBlock));
  }
  return { ...msg, content };
}

function looksLikeGeminiRequest(value) {
  return !!(value && typeof value === 'object' && (
    Array.isArray(value.contents)
    || !!value.systemInstruction
  ));
}

function geminiRequest(body) {
  if (!body || typeof body !== 'object') return {};
  if (looksLikeGeminiRequest(body.request)) return body.request;
  return looksLikeGeminiRequest(body) ? body : {};
}

function isGeminiRequestBody(body) {
  return looksLikeGeminiRequest(geminiRequest(body));
}

function geminiTextFromParts(parts) {
  if (!Array.isArray(parts)) return '';
  return parts
    .filter(part => part && typeof part === 'object' && typeof part.text === 'string')
    .map(part => part.text)
    .join('\n');
}

function geminiSystemInstruction(body) {
  const instruction = geminiRequest(body).systemInstruction;
  if (!instruction || typeof instruction !== 'object') return '';
  return geminiTextFromParts(instruction.parts).trim();
}

function geminiRole(role) {
  return role === 'model' ? 'assistant' : (typeof role === 'string' && role ? role : 'user');
}

function geminiFunctionResponseContent(response) {
  const payload = response?.response;
  /* Unwrap `output` only when it is the whole response.  A sibling field beside it
     is real result data the model was given, so unwrapping dropped it from the
     display and from the bloat measurement at once: {output: 'ok', logs: <25 KB>}
     showed two bytes and earned no badge.  Widening only the bloat payload would
     trade that for the opposite bug, a badge whose bytes the reader cannot find. */
  const unwrap = payload && typeof payload === 'object' && !Array.isArray(payload)
    && Object.prototype.hasOwnProperty.call(payload, 'output')
    && Object.keys(payload).length === 1;
  const output = unwrap ? payload.output : payload;
  if (typeof output === 'string') return output;
  if (output === undefined || output === null) return '';
  return JSON.stringify(output, null, 2);
}

function geminiPartContentBlocks(part) {
  const blocks = [];
  if (!part || typeof part !== 'object') return blocks;
  if (typeof part.text === 'string' && part.text.trim()) {
    if (part.thought === true) blocks.push({ type: 'thinking', thinking: part.text });
    else blocks.push({ type: 'text', text: part.text });
  }
  if (part.functionCall && typeof part.functionCall === 'object') {
    const call = part.functionCall;
    blocks.push({
      type: 'tool_use',
      id: call.id || '',
      name: call.name || 'tool_use',
      input: call.args && typeof call.args === 'object' ? call.args : {},
    });
  }
  if (part.functionResponse && typeof part.functionResponse === 'object') {
    const response = part.functionResponse;
    blocks.push({
      type: 'tool_result',
      tool_use_id: response.id || response.name || '',
      content: geminiFunctionResponseContent(response),
    });
  }
  return blocks;
}

function geminiMessages(body, forBloat) {
  const contents = geminiRequest(body).contents;
  if (!Array.isArray(contents)) return [];
  return contents.map(item => {
    if (!item || typeof item !== 'object') return null;
    const blocks = (item.parts || []).flatMap(geminiPartContentBlocks);
    if (!blocks.length) return null;
    let role = geminiRole(item.role);
    /* Display already splits functionResponse parts into separate blocks.
       Collapsing them to role=tool would make the bloat scan wrap the
       whole list as one result. */
    if (!forBloat && blocks.every(block => block.type === 'tool_result')) role = 'tool';
    return { role, content: blocks };
  }).filter(Boolean);
}

function flattenGeminiTools(tools) {
  if (!Array.isArray(tools)) return [];
  const flattened = [];
  for (const group of tools) {
    if (!group || typeof group !== 'object') continue;
    const declarations = group.functionDeclarations;
    if (!Array.isArray(declarations)) continue;
    for (const decl of declarations) {
      if (!decl || typeof decl !== 'object') continue;
      flattened.push({
        name: decl.name || '',
        description: decl.description || '',
        input_schema: decl.parametersJsonSchema || decl.parameters || {},
      });
    }
  }
  return flattened;
}

function responsesInputAdditionalTools(input) {
  if (!Array.isArray(input)) return [];
  const tools = [];
  for (const item of input) {
    if (!item || typeof item !== 'object') continue;
    if (item.type !== 'additional_tools') continue;
    if (!Array.isArray(item.tools)) continue;
    for (const tool of item.tools) {
      if (!tool || typeof tool !== 'object') continue;
      tools.push(tool);
    }
  }
  return tools;
}

function uniqueToolsByDisplayName(tools) {
  const seen = new Set();
  const unique = [];
  for (const tool of tools) {
    const name = toolDisplayName(tool);
    const key = name || JSON.stringify(tool);
    if (seen.has(key)) continue;
    seen.add(key);
    unique.push(tool);
  }
  return unique;
}

function getRequestTools(body) {
  const direct = Array.isArray(body?.tools) ? body.tools : [];
  const responsesAdditional = responsesInputAdditionalTools(body?.input);
  const geminiTools = flattenGeminiTools(geminiRequest(body).tools);
  if (geminiTools.length) return geminiTools;
  return uniqueToolsByDisplayName([...direct, ...responsesAdditional]);
}

function jsonSchemaTypeFromValue(value) {
  if (value === null || value === undefined) return 'string';
  if (Array.isArray(value)) return 'array';
  if (typeof value === 'number') return Number.isInteger(value) ? 'integer' : 'number';
  if (typeof value === 'object') return 'object';
  return typeof value;
}

function mergeObservedToolUse(byName, block) {
  if (!block || block.type !== 'tool_use' || typeof block.name !== 'string' || !block.name) return;
  const existing = byName.get(block.name) || {
    name: block.name,
    input_schema: { type: 'object', properties: {} },
  };
  const input = block.input && typeof block.input === 'object' && !Array.isArray(block.input) ? block.input : {};
  const props = existing.input_schema.properties;
  for (const key of Object.keys(input)) {
    if (!props[key]) props[key] = { type: jsonSchemaTypeFromValue(input[key]) };
  }
  byName.set(block.name, existing);
}

function cursorTranscriptConversationKey(entry) {
  const captured = entry?.capture?.cursor_transcript_id;
  if (typeof captured === 'string' && captured.trim()) return captured.trim();
  const path = String(entry?.request?.path || '');
  const match = path.match(/^\/cursor\/transcript\/([^/]+)\//);
  return match ? match[1] : '';
}

function cursorTranscriptObservedTools(current) {
  const isCursor = current?.transport === 'cursor-transcript'
    || String(current?.request?.path || '').startsWith('/cursor/transcript/');
  if (!isCursor) return [];
  const byName = new Map();
  const currentKey = cursorTranscriptConversationKey(current);
  const pool = Array.isArray(entries) && entries.length ? entries : (current ? [current] : []);
  for (const entry of pool) {
    if (entry && entry.transport && entry.transport !== 'cursor-transcript') continue;
    if (currentKey && cursorTranscriptConversationKey(entry) !== currentKey) continue;
    const content = getResponsePayload(entry)?.content;
    if (!Array.isArray(content)) continue;
    for (const block of content) mergeObservedToolUse(byName, block);
  }
  return [...byName.values()];
}

function getDetailTools(entry, reqBody, respPayload) {
  const requestTools = getRequestTools(reqBody);
  if (requestTools.length) return requestTools;
  const observed = cursorTranscriptObservedTools(entry);
  if (observed.length) return observed;
  return getRequestTools(respPayload);
}

function hasDisplayContent(content) {
  if (typeof content === 'string') return content.trim().length > 0;
  if (!Array.isArray(content)) return content !== undefined && content !== null;
  return content.some(block => {
    if (!block || typeof block !== 'object') return false;
    if (block.type === 'text' || block.type === 'input_text' || block.type === 'output_text') {
      /* Some Responses captures store the value under `output`. Reading only
         `text` makes this helper return false, so `renderMessages` drops the
         entire user turn -- title in the sidebar, empty pane in the detail.
         `blockInputText` rather than a local ternary: an empty `text` beside a
         populated `output` has to yield the same way it does for the sidebar
         title and the Python mirror. */
      return !!blockInputText(block).trim();
    }
    if (block.type === 'image' || block.type === 'input_image') {
      const source = block.source || {};
      return !!(block.image_url || block.file_id || source.data || source.url || source.media_type || source.file_id);
    }
    if (block.type === 'thinking') return !!(block.thinking || '').trim();
    if (block.type === 'tool_use') return true;
    if (block.type === 'tool_result') {
      const rc = block.content;
      if (typeof rc === 'string') return rc.trim().length > 0 || !!block.tool_use_id;
      if (Array.isArray(rc)) return rc.length > 0;
      return rc !== undefined && rc !== null;
    }
    return JSON.stringify(block) !== '{}';
  });
}

function extractSystem(body) {
  if (!body) return null;
  const parts = [];
  if (typeof body.system === 'string' && body.system.trim()) parts.push(body.system);
  if (Array.isArray(body.system)) {
    const systemText = body.system.map(b => typeof b === 'string' ? b : b.type === 'text' ? (b.text || '') : JSON.stringify(b)).filter(Boolean).join('\n\n');
    if (systemText.trim()) parts.push(systemText);
  }
  // Responses API: instructions field holds the system prompt
  if (typeof body.instructions === 'string' && body.instructions.trim()) parts.push(body.instructions);
  const chatInstructions = chatInstructionMessages(body)
    .map(m => chatMessageContentToText(m.content))
    .filter(text => text.trim());
  parts.push(...chatInstructions);
  const geminiSystem = geminiSystemInstruction(body);
  if (geminiSystem) parts.push(geminiSystem);
  return parts.length ? parts.join('\n\n') : null;
}

function extractSystemBlocks(body) {
  if (!body) return [];
  const blocks = [];
  if (typeof body.system === 'string' && body.system.trim()) {
    blocks.push(...normalizeDisplayContentBlocks(body.system));
  }
  if (Array.isArray(body.system)) {
    blocks.push(...normalizeDisplayContentBlocks(body.system));
  }
  if (typeof body.instructions === 'string' && body.instructions.trim()) {
    blocks.push(...normalizeDisplayContentBlocks(body.instructions));
  }
  for (const message of chatInstructionMessages(body)) {
    blocks.push(...normalizeDisplayContentBlocks(message.content));
  }
  const geminiSystem = geminiSystemInstruction(body);
  if (geminiSystem) {
    blocks.push(...normalizeDisplayContentBlocks(geminiSystem));
  }
  return blocks;
}

function parseSseDataFrames(text) {
  if (typeof text !== 'string' || !text.includes('data:')) return [];
  const events = [];
  let dataLines = [];
  const flush = () => {
    if (!dataLines.length) return;
    const raw = dataLines.join('\n');
    dataLines = [];
    if (raw === '[DONE]') return;
    let data = raw;
    try { data = JSON.parse(raw); } catch(e) {}
    events.push({ event: 'message', data });
  };
  for (const line of text.split(/\r?\n/)) {
    if (line.startsWith('data:')) {
      dataLines.push(line.slice(5).trim());
      continue;
    }
    if (!line.trim()) flush();
  }
  flush();
  return events;
}

function getResponseEvents(entry) {
  const sse = entry?.response?.sse_events;
  if (Array.isArray(sse) && sse.length > 0) return sse;
  const ws = entry?.response?.ws_events;
  if (Array.isArray(ws) && ws.length > 0) return ws;
  return parseSseDataFrames(entry?.response?.body);
}

function getEventType(event) {
  if (!event || typeof event !== 'object') return '';
  return typeof event.event === 'string' ? event.event : (typeof event.type === 'string' ? event.type : '');
}

function getEventData(event) {
  if (!event || typeof event !== 'object') return null;
  let data = Object.prototype.hasOwnProperty.call(event, 'data') ? event.data : event;
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch(e) { return null; }
  }
  return data && typeof data === 'object' ? data : null;
}

function getResponsePayload(entry) {
  const body = entry?.response?.body;
  if (body && typeof body === 'object') return body;
  const response = entry?.response;
  if (!response || typeof response !== 'object') return null;
  if (response.output || response.content || response.usage || response.previous_response_id || response.id || response.error) return response;
  return null;
}

function getResponsesContinuationInfo(entry) {
  if (entry?.derived_from_websocket) return null;
  const body = entry?.request?.body;
  if (!body || typeof body !== 'object') return null;
  const path = entry?.request?.path || '';
  const looksLikeResponses = path.endsWith('/v1/responses') || path === '/responses' || body.type === 'response.create' || Array.isArray(body.input);
  if (!looksLikeResponses) return null;
  const payload = getResponsePayload(entry) || {};
  const previousId = payload.previous_response_id || body.previous_response_id;
  if (!previousId) return null;
  const userMessages = getMessages(body).filter(m => m.role === 'user');
  if (userMessages.length > 0) return null;
  const headers = entry?.request?.headers || {};
  return {
    response_id: payload.id || '',
    previous_response_id: previousId,
    prompt_cache_key: body.prompt_cache_key || '',
    session_id: headers.session_id || headers['session-id'] || '',
    codex_version: headers.version || headers['x-codex-version'] || '',
  };
}

// Normalize messages from Chat Completions (body.messages) or Responses API (body.input)
function getMessages(body, options) {
  const forBloat = !!(options && options.forBloat);
  if (!body) return [];
  if (Array.isArray(body.messages) && body.messages.length > 0) {
    /* Display wraps tool-role payloads; the bloat scan measures that same
       raw content once so it does not serialize the wrapper a second time. */
    if (forBloat) {
      return body.messages.filter(m => m && typeof m === 'object');
    }
    return body.messages
      .filter(m => !isChatInstructionRole(m?.role))
      .map(normalizeChatMessageForDisplay)
      .filter(m => hasDisplayContent(m.content));
  }
  if (isGeminiRequestBody(body)) {
    return geminiMessages(body, forBloat).filter(m => hasDisplayContent(m.content));
  }
  if (Array.isArray(body.input)) {
    const normalizedInput = normalizeWebSocketDerivedInput(body.input, forBloat);
    const messages = normalizedInput.filter(item => {
      if (!item || typeof item !== 'object') return false;
      if (typeof item.role !== 'string' || !item.role) return false;
      return item.type === undefined || item.type === 'message';
    }).map(item => ({
      role: item.role || 'user',
      content: Array.isArray(item.content)
        ? item.content.map(c => {
            if (!c || typeof c !== 'object') return c;
            /* Some captures carry the text under `output` rather than `text`.
               Rebuilding the block with `text` alone drops it here, before the
               sidebar's own `output` fallback can ever see it, so a session at or
               below LAZY_THRESHOLD would lose the title that lazy Python metadata
               keeps. */
            if (c.type === 'input_text' || c.type === 'output_text' || c.type === 'text') {
              /* Put the `output` fallback on `text` so `hasDisplayContent` and
                 `renderContent` -- which both read `text` for known types --
                 keep the turn. `text` wins only when it says something: an empty
                 string is the shape these captures use to mean "the text is under
                 `output`", and treating it as authoritative here discarded the
                 only readable content the block had. `blockInputText` and its
                 Python mirror both yield on blank text; this has to agree, or the
                 same turn is titled from `output` above LAZY_THRESHOLD and left
                 untitled below it. */
              const blockText = typeof c.text === 'string' && c.text.trim() ? c.text : '';
              if (blockText) return { type: c.type, text: blockText };
              return typeof c.output === 'string'
                ? { type: c.type, text: c.output }
                : { type: c.type, text: c.text };
            }
            if (c.type === 'tool_use') return c;
            if (c.type === 'tool_result') return c;
            return c;
          })
        : item.content
    }));
    if (shouldPrependResponsesInstructions(body, messages)) {
      return [{ role: 'developer', content: [{ type: 'text', text: body.instructions }] }, ...messages];
    }
    return messages;
  }
  return [];
}

function shouldPrependResponsesInstructions(body, messages) {
  if (!Array.isArray(body?.input) || body.input.length === 0) return false;
  if (!Array.isArray(messages) || messages.length === 0) return false;
  if (messages.some(m => m.role === 'developer' || m.role === 'system')) return false;
  if (!messages.some(m => m.role === 'user')) return false;
  return typeof body.instructions === 'string' && body.instructions.trim();
}

function shouldRenderRequestContext(entry, body, msgs, respOutput) {
  if (!entry || !body || !Array.isArray(msgs) || msgs.length === 0) return false;
  const method = entry?.request?.method || '';
  if (!entry.derived_from_websocket && entry.transport !== 'websocket' && method !== 'WEBSOCKET') return false;
  const path = getPath(entry);
  if (!path.includes('/codex/responses') && !path.includes('/v1/responses')) return false;
  if (!Array.isArray(body.input) || body.input.length === 0) return false;
  return true;
}

function tokenCount(value) {
  return typeof value === 'number' && Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
}

function normalizeUsage(usage) {
  if (!usage || typeof usage !== 'object') return null;
  const normalized = { ...usage };
  if ((normalized.input_tokens === undefined || normalized.input_tokens === null || normalized.input_tokens === 0) && usage.prompt_tokens) {
    normalized.input_tokens = usage.prompt_tokens;
  }
  if ((normalized.input_tokens === undefined || normalized.input_tokens === null || normalized.input_tokens === 0) && usage.promptTokenCount) {
    normalized.input_tokens = usage.promptTokenCount;
  }
  if ((normalized.input_tokens === undefined || normalized.input_tokens === null || normalized.input_tokens === 0) && usage.inputTokens) {
    normalized.input_tokens = usage.inputTokens;
  }
  if ((normalized.output_tokens === undefined || normalized.output_tokens === null || normalized.output_tokens === 0) && usage.completion_tokens) {
    normalized.output_tokens = usage.completion_tokens;
  }
  if ((normalized.output_tokens === undefined || normalized.output_tokens === null || normalized.output_tokens === 0) && (usage.candidatesTokenCount || usage.thoughtsTokenCount)) {
    /* Gemini keeps reasoning tokens out of candidatesTokenCount but bills them
       at the output rate, so the displayed total has to include both. Mirrors
       claude_tap/usage.py. */
    normalized.output_tokens = tokenCount(usage.candidatesTokenCount) + tokenCount(usage.thoughtsTokenCount);
  }
  if ((normalized.output_tokens === undefined || normalized.output_tokens === null || normalized.output_tokens === 0) && usage.outputTokens) {
    normalized.output_tokens = usage.outputTokens;
  }
  if ((normalized.total_tokens === undefined || normalized.total_tokens === null || normalized.total_tokens === 0) && usage.totalTokens) {
    normalized.total_tokens = usage.totalTokens;
  }
  if (normalized.cache_read_input_tokens === undefined) {
    /* Cache tokens derived from OpenAI/Gemini-style details fields are already
       counted inside input_tokens/prompt_tokens.  Mark them so the cache hit
       rate denominator can avoid double-counting. */
    let embeddedCached = usage.cached_tokens;
    if (embeddedCached === undefined) embeddedCached = usage.cachedContentTokenCount;
    /* `input_token_details` is singular on OpenAI Realtime responses, and
       pricing.py already lists it among the Realtime modality buckets. Left out,
       a Realtime cache hit yielded no cache_read_input_tokens at all, so the whole
       prompt was billed at the full input rate and no cache read was shown. */
    for (const key of ['input_tokens_details', 'input_token_details', 'prompt_tokens_details']) {
      if (embeddedCached !== undefined) break;
      if (usage[key] && typeof usage[key] === 'object') embeddedCached = usage[key].cached_tokens;
    }
    /* Direct DeepSeek names its two prompt buckets outright instead of nesting
       them under a details object.  Both are counted inside prompt_tokens, so
       this is an embedded bucket like the ones above. */
    if (embeddedCached === undefined) embeddedCached = usage.prompt_cache_hit_tokens;
    if (embeddedCached !== undefined && embeddedCached !== null) {
      normalized.cache_read_input_tokens = embeddedCached;
      normalized._cache_read_in_input = true;
    } else if (usage.cacheReadInputTokens !== undefined && usage.cacheReadInputTokens !== null) {
      normalized.cache_read_input_tokens = usage.cacheReadInputTokens;
      normalized._cache_read_in_input = false;
    }
  } else {
    /* Native cache_read_input_tokens (Claude/Anthropic/Bedrock) is a separate
       bucket not included in input_tokens.  But if the caller already set
       _cache_read_in_input (e.g. lazy-loading stub with model-based inference),
       respect the pre-set value. */
    if (normalized._cache_read_in_input === undefined) {
      normalized._cache_read_in_input = false;
    }
  }
  if (normalized.cache_creation_input_tokens === undefined && usage.cacheWriteInputTokens !== undefined && usage.cacheWriteInputTokens !== null) {
    normalized.cache_creation_input_tokens = usage.cacheWriteInputTokens;
  }
  return normalized;
}

// Extract token usage from response.body.usage or SSE response.completed event
function getUsage(entry) {
  const u = getResponsePayload(entry)?.usage;
  if (u) return normalizeUsage(u);
  const geminiUsage = geminiUsageFromPayloads(entry);
  if (geminiUsage) return geminiUsage;
  const events = getResponseEvents(entry);
  for (let i = events.length - 1; i >= 0; i--) {
    if (getEventType(events[i]) !== 'response.completed') continue;
    const data = getEventData(events[i]);
    if (data?.response?.usage) return normalizeUsage(data.response.usage);
  }
  return null;
}

function normalizeResponseOutput(output) {
  if (!Array.isArray(output) || output.length === 0) return null;
  const content = [];
  for (const item of output) {
    if (!item || typeof item !== 'object') continue;
    if (item.type === 'message' && Array.isArray(item.content)) {
      for (const c of item.content) {
        if (c?.type === 'output_text') content.push({ type: 'text', text: c.text });
        else content.push(c);
      }
    } else if (isResponseCallItem(item)) {
      content.push({ type: 'tool_use', id: item.call_id || item.id || '', name: responseCallToolName(item), input: responseCallInput(item) });
    } else if (item.type === 'reasoning') {
      if (!item.summary) continue;
      const summaryText = Array.isArray(item.summary) ? item.summary.map(s => s?.text || '').join('\n') : (item.summary.text || JSON.stringify(item.summary));
      if (summaryText.trim()) content.push({ type: 'thinking', thinking: summaryText });
    }
  }
  return content.length > 0 ? { content } : null;
}

function normalizeBedrockConverseContent(blocks) {
  if (!Array.isArray(blocks) || blocks.length === 0) return [];
  const content = [];
  for (const block of blocks) {
    if (!block || typeof block !== 'object') continue;
    if (typeof block.text === 'string') {
      appendMergeableResponseBlock(content, { type: 'text', text: block.text });
      continue;
    }
    const reasoning = block.reasoningContent;
    if (reasoning && typeof reasoning === 'object') {
      const reasoningText = reasoning.text || reasoning.reasoningText?.text || '';
      const signature = reasoning.signature || reasoning.reasoningText?.signature || '';
      const thinking = { type: 'thinking', thinking: reasoningText };
      if (signature) thinking.signature = signature;
      if (reasoningText.trim() || signature) content.push(thinking);
      continue;
    }
    const toolUse = block.toolUse;
    if (toolUse && typeof toolUse === 'object') {
      content.push({
        type: 'tool_use',
        id: toolUse.toolUseId || '',
        name: toolUse.name || 'tool_use',
        input: toolUse.input && typeof toolUse.input === 'object' ? toolUse.input : {},
      });
      continue;
    }
    if (block.type) content.push(block);
  }
  return content;
}

function normalizeBedrockConverseOutput(body) {
  const message = body?.output?.message;
  if (!message || typeof message !== 'object') return null;
  const content = normalizeBedrockConverseContent(message.content);
  return content.length > 0 ? { content } : null;
}

function normalizeChatCompletionsChoiceOutput(body) {
  if (!Array.isArray(body?.choices) || body.choices.length === 0) return null;
  const content = [];
  for (const choice of body.choices) {
    const message = choice?.message || choice?.delta;
    if (!message || typeof message !== 'object') continue;
    if (Array.isArray(message.reasoning_details)) {
      for (const detail of message.reasoning_details) {
        const text = detail?.text;
        if (typeof text === 'string' && text.trim()) {
          appendMergeableResponseBlock(content, { type: 'thinking', thinking: text });
        }
      }
    }
    if (!content.length && typeof message.reasoning_content === 'string' && message.reasoning_content.trim()) {
      appendMergeableResponseBlock(content, { type: 'thinking', thinking: message.reasoning_content });
    }
    if (!content.length && typeof message.reasoning === 'string' && message.reasoning.trim()) {
      appendMergeableResponseBlock(content, { type: 'thinking', thinking: message.reasoning });
    }
    if (typeof message.thinking === 'string' && message.thinking.trim()) {
      appendMergeableResponseBlock(content, { type: 'thinking', thinking: message.thinking });
    }
    const normalized = normalizeChatMessageForDisplay({ role: 'assistant', ...message });
    for (const block of normalizeDisplayContentBlocks(normalized.content)) {
      appendMergeableResponseBlock(content, block);
    }
  }
  return content.length > 0 ? { content } : null;
}

function appendMergeableResponseBlock(content, block) {
  if (!block || typeof block !== 'object') return;
  const prev = content.length ? content[content.length - 1] : null;
  if (prev && prev.type === block.type) {
    if (block.type === 'thinking') {
      prev.thinking = (prev.thinking || '') + (block.thinking || '');
      return;
    }
    if (block.type === 'text' || block.type === 'input_text' || block.type === 'output_text') {
      prev.text = (prev.text || '') + (block.text || '');
      return;
    }
  }
  content.push(block);
}

function reconstructOutputFromEvents(events) {
  if (!Array.isArray(events) || events.length === 0) return null;
  const outputItems = [];
  for (const ev of events) {
    if (getEventType(ev) !== 'response.output_item.done') continue;
    const data = getEventData(ev);
    const item = data?.item;
    const outputIndex = data?.output_index;
    if (!item || typeof item !== 'object' || !Number.isInteger(outputIndex)) continue;
    outputItems.push({ outputIndex, item });
  }
  if (outputItems.length === 0) return null;
  return normalizeResponseOutput(
    outputItems
      .sort((a, b) => a.outputIndex - b.outputIndex)
      .map(({ item }) => item)
  );
}

function geminiResponsePayloads(entry) {
  const body = entry?.response?.body;
  if (typeof body === 'string') {
    return parseSseDataFrames(body)
      .map(event => event.data)
      .filter(data => data && typeof data === 'object');
  }
  if (body && typeof body === 'object') return [body];
  return [];
}

function geminiUsageFromPayloads(entry) {
  if (!isGeminiRequestBody(entry?.request?.body)) return null;
  let usage = null;
  for (const payload of geminiResponsePayloads(entry)) {
    const response = payload?.response && typeof payload.response === 'object' ? payload.response : payload;
    if (response?.usageMetadata) usage = response.usageMetadata;
  }
  return usage ? normalizeUsage(usage) : null;
}

function geminiResponseOutput(entry) {
  if (!isGeminiRequestBody(entry?.request?.body)) return null;
  const content = [];
  for (const payload of geminiResponsePayloads(entry)) {
    const response = payload?.response && typeof payload.response === 'object' ? payload.response : payload;
    const candidates = response?.candidates;
    if (!Array.isArray(candidates)) continue;
    for (const candidate of candidates) {
      const parts = candidate?.content?.parts;
      if (!Array.isArray(parts)) continue;
      for (const part of parts) {
        if (!part || typeof part !== 'object') continue;
        if (typeof part.text === 'string') {
          if (part.thought === true && part.text.trim()) {
            appendMergeableResponseBlock(content, { type: 'thinking', thinking: part.text });
          } else if (part.text.trim()) {
            appendMergeableResponseBlock(content, { type: 'text', text: part.text });
          }
        }
        if (part.functionCall && typeof part.functionCall === 'object') {
          const call = part.functionCall;
          content.push({
            type: 'tool_use',
            id: call.id || '',
            name: call.name || 'tool_use',
            input: call.args && typeof call.args === 'object' ? call.args : {},
          });
        }
      }
    }
  }
  return content.length ? { content } : null;
}

// Extract response output from response.body.content or SSE response.completed event
function getResponseOutput(entry) {
  const geminiOutput = geminiResponseOutput(entry);
  if (geminiOutput) return geminiOutput;
  const body = getResponsePayload(entry);
  if (body?.content) return body;
  const fromBedrockConverse = normalizeBedrockConverseOutput(body);
  if (fromBedrockConverse) return fromBedrockConverse;
  const fromChoices = normalizeChatCompletionsChoiceOutput(body);
  if (fromChoices) return fromChoices;
  const fromBody = normalizeResponseOutput(body?.output);
  if (fromBody) return fromBody;
  const events = getResponseEvents(entry);
  const fromItems = reconstructOutputFromEvents(events);
  if (fromItems) return fromItems;
  for (let i = events.length - 1; i >= 0; i--) {
    if (getEventType(events[i]) !== 'response.completed') continue;
    const data = getEventData(events[i]);
    const normalized = normalizeResponseOutput(data?.response?.output);
    if (normalized) return normalized;
  }
  return null;
}
function renderSystemPrompt(blocks, copyText = '') {
  const normalized = normalizeDisplayContentBlocks(blocks);
  if (normalized.length <= 1 && copyText) return `<div class="pre-text">${esc(copyText)}</div>`;
  return `<div class="system-prompt-blocks">${renderContent(normalized, 'system', { frameBlocks: normalized.length > 1 })}</div>`;
}

function renderResponsesContinuationNotice(info) {
  const rows = [
    ['previous_response_id', info.previous_response_id],
    ['response_id', info.response_id],
    ['prompt_cache_key', info.prompt_cache_key],
    ['session_id', info.session_id],
    ['codex_version', info.codex_version],
  ].filter(([, value]) => value);
  const meta = rows.length
    ? `<div class="cb-meta">${rows.map(([key, value]) => `<div class="cb-key">${esc(key)}</div><div class="cb-val">${esc(value)}</div>`).join('')}</div>`
    : '';
  return `<div class="continuation-banner"><div class="cb-icon">&#9888;</div><div class="cb-content"><div class="cb-title">${esc(t('continuation_title'))}</div><div class="cb-message">${esc(t('continuation_message'))}</div>${meta}</div></div>`;
}

function renderMessages(msgs) {
  return msgs.map(m => {
    const role = m.role || 'unknown';
    const cls = role === 'user' ? 'user' : role === 'assistant' ? 'assistant' : role === 'tool' ? 'tool_result' : (role === 'developer' || role === 'system') ? 'system' : 'system';
    const blockCount = normalizeDisplayContentBlocks(m.content).length;
    const messageOrigin = role === 'user' && !isToolResultOnlyMessage(m)
      ? preferredUserTextForMessage(m)
      : null;
    const rendered = renderContent(m.content, role, {
      frameBlocks: blockCount > 1,
      blockOrigins: messageOrigin ? disagreeingBlockOrigins(m.content, messageOrigin.origin) : null,
    });
    if (!rendered.trim()) return '';
    /* The wire format has no author field, so a harness recap request and a typed
       question both arrive as role:"user". Label the ones we can recognize. */
    let originTag = '';
    if (role === 'user' && !isToolResultOnlyMessage(m)) {
      /* Decided on the raw text by the same helper that titles the sidebar group,
         so a badge here and a title there always agree, and an injection that
         shares its message with a tool result is still seen. Blocks that disagree
         with this verdict are badged individually inside renderContent. */
      originTag = userOriginBadge(messageOrigin.origin, messageOrigin.kind);
    }
    return `<div class="msg ${cls}"><div class="msg-role">${esc(role)}${originTag}</div>${rendered}</div>`;
  }).filter(Boolean).join('');
}

function contentHasImagePlaceholder(content) {
  if (typeof content === 'string') return /\[Image #\d+\]/i.test(content);
  if (!Array.isArray(content)) return content && typeof content === 'object' && contentHasImagePlaceholder(content.content || content.text || content.output || '');
  return content.some(block => {
    if (typeof block === 'string') return contentHasImagePlaceholder(block);
    if (!block || typeof block !== 'object') return false;
    return contentHasImagePlaceholder(block.text || block.output || block.content || '');
  });
}

/* Per-display-block provenance, but only where it contradicts the badge already on

   walks -- eligibleUserTextBlocks skips tool results and so numbers differently. */
function disagreeingBlockOrigins(content, messageOrigin) {
  const blocks = normalizeDisplayContentBlocks(content);
  if (blocks.length < 2) return null;
  let any = false;
  const origins = blocks.map(block => {
    if (block.type !== 'text' && block.type !== 'input_text' && block.type !== 'output_text') return null;
    const raw = blockInputText(block);
    if (!raw.trim()) return null;
    /* Cleaned-or-raw, exactly as preferredUserTextForMessage decides it: cleaning

       the braces as ordinary prose, so the block came back human and went
       unbadged. Falling back to raw keeps provenance for an injection that
       cleaning blanks entirely, where the empty string would classify human. */
    const { origin, kind } = classifyUserInputOrigin(cleanUserPromptText(raw) || raw);
    if (origin === messageOrigin) return null;
    any = true;
    return [origin, kind];
  });
  return any ? origins : null;
}

/* One badge, built the same way for a whole message and for a single block, so a

   text, which needs no qualifier. */
function userOriginBadge(origin, kind, extraClass = 'msg-origin') {
  if (!origin || origin === 'human') return '';
  const key = origin === 'harness' ? 'origin_harness' : 'origin_payload';
  const label = kindLabel(kind) ? `${t(key)}·${kindLabel(kind)}` : t(key);
  const hint = t(origin === 'harness' ? 'origin_harness_hint' : 'origin_payload_hint');
  return `<span class="${extraClass} origin-${origin}" title="${esc(hint)}">${esc(label)}</span>`;
}

function wrapContentBlock(inner, block, index, total, options = {}) {
  const frameBlock = !!options.frameBlocks && total > 1;
  const classes = ['content-block'];
  if (frameBlock) classes.push('block-framed');
  if (options.extraClass) classes.push(...String(options.extraClass).split(/\s+/).filter(Boolean));
  return `<div class="${classes.join(' ')}">${inner}</div>`;
}

function isInlineImageUrl(url) {
  return typeof url === 'string' && /^data:image\//i.test(url);
}

function imageSourceFromBlock(block) {
  if (!block || typeof block !== 'object') return null;
  const source = block.source || {};
  if (
    (block.type === 'image' || block.type === 'input_image' || source.type === 'base64') &&
    source.type === 'base64' &&
    source.data
  ) {
    return { src: `data:${source.media_type || 'image/png'};base64,${source.data}`, alt: source.media_type || 'image' };
  }
  if (
    (block.type === 'image' || block.type === 'input_image' || source.type === 'url') &&
    source.type === 'url' &&
    isInlineImageUrl(source.url)
  ) {
    return { src: source.url, alt: source.media_type || 'image' };
  }
  const imageUrl = block.image_url;
  if (typeof imageUrl === 'string' && isInlineImageUrl(imageUrl)) return { src: imageUrl, alt: 'image' };
  if (imageUrl && typeof imageUrl === 'object' && isInlineImageUrl(imageUrl.url)) return { src: imageUrl.url, alt: 'image' };
  if (block.data && (block.media_type || block.mime_type)) {
    return { src: `data:${block.media_type || block.mime_type};base64,${block.data}`, alt: block.media_type || block.mime_type || 'image' };
  }
  return null;
}

function imageBlocksForContent(content) {
  const images = [];
  const visit = value => {
    if (!value) return;
    if (Array.isArray(value)) {
      value.forEach(visit);
      return;
    }
    if (typeof value !== 'object') return;
    if (imageSourceFromBlock(value)) images.push(value);
    if (value.type === 'message' || value.type === 'tool_result' || value.type === 'function_call_output') visit(value.content);
  };
  visit(content);
  return images;
}

function imageSourceKey(block) {
  const source = imageSourceFromBlock(block);
  return source ? source.src.slice(0, 128) + ':' + source.src.length : '';
}

function buildSessionImageRegistry() {
  if (sessionImageRegistryCache && sessionImageRegistrySize === entries.length) return sessionImageRegistryCache;
  const registry = new Map();
  const sourceEntries = lazyMode
    ? expandWebSocketResponseEntries(getRawLines().map(line => { try { return JSON.parse(line); } catch { return null; } }).filter(Boolean))
    : entries.map(getFullEntry);
  for (const entry of sourceEntries) {
    const messages = getMessages(entry?.request?.body);
    for (const message of messages) {
      if (message?.role !== 'user') continue;
      const images = imageBlocksForContent(message.content);
      if (!images.length) continue;
      const key = imageLookupKey(naturalTextForSessionContent(message.content));
      if (!key) continue;
      const bucket = registry.get(key) || [];
      const seen = new Set(bucket.map(imageSourceKey));
      for (const image of images) {
        const imageKey = imageSourceKey(image);
        if (!imageKey || seen.has(imageKey)) continue;
        seen.add(imageKey);
        bucket.push(image);
      }
      registry.set(key, bucket);
    }
  }
  sessionImageRegistryCache = registry;
  sessionImageRegistrySize = entries.length;
  return registry;
}

function recoveredImagesForContent(content) {
  if (!contentHasImagePlaceholder(content) || imageBlocksForContent(content).length) return [];
  const key = imageLookupKey(naturalTextForSessionContent(content));
  if (!key) return [];
  return buildSessionImageRegistry().get(key) || [];
}

function renderImageElement(src, alt = 'image') {
  return `<img class="content-image message-image" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" />`;
}

function renderImageElementForBlock(block) {
  const source = imageSourceFromBlock(block);
  if (!source) return '';
  return renderImageElement(source.src, source.alt);
}

function renderImageBlock(block, index = 0, total = 1, options = {}) {
  const inner = renderImageElementForBlock(block);
  return inner ? wrapContentBlock(inner, block, index, total, { ...options, extraClass: 'image-block' }) : '';
}

function toolBloatBanner(block) {
  const bloat = toolResultBloatInfo(block);
  if (!bloat) return '';
  return `<div class="tool-bloat-alert"><span class="tba-icon">&#9888;</span><span>${esc(t('tool_bloat_warning'))}: ${esc(bloat.sizeKB)} KB (~${esc(bloat.estTokens.toLocaleString())} ${esc(t('tok'))})</span></div>`;
}

function renderContent(content, role, options = {}) {
  const blocks = normalizeDisplayContentBlocks(content);
  const renderedBlocks = blocks.map((block, index) => {
    if (block.type === 'text' || block.type === 'input_text' || block.type === 'output_text') {
      const txt = blockInputText(block);
      if (!txt.trim()) return '';
      /* A CLI can put an injected block and the user's own prose in one message.
         The message-level badge names only the block the sidebar took its title
         from, so an injection sharing a message with human prose would otherwise
         render under a bare "user" label. Badge the blocks that disagree with the
         message verdict; a message whose blocks all agree keeps one badge. */
      const blockOrigin = options.blockOrigins ? options.blockOrigins[index] : null;
      const blockTag = blockOrigin ? userOriginBadge(blockOrigin[0], blockOrigin[1], 'block-origin') : '';
      return wrapContentBlock(`${blockTag}<div class="content-block-text">${esc(txt)}</div>`, block, index, blocks.length, options);
    }
    if (block.type === 'thinking') {
      const thinking = block.thinking || '';
      if (!thinking.trim()) return '';
      return wrapContentBlock(`<span class="thinking-label">thinking</span><div class="pre-text">${esc(thinking)}</div>`, block, index, blocks.length, options);
    }
    if (block.type === 'tool_use') {
      const label = block.id ? `${block.name || 'tool_use'} (${block.id})` : (block.name || 'tool_use');
      return wrapContentBlock(`<span class="tool-use-label">${esc(label)}</span>${renderToolInput(block.input)}`, block, index, blocks.length, options);
    }
    if (block.type === 'tool_result') {
      const rc = block.content;
      const bloatBanner = toolBloatBanner(block);
      if (typeof rc === 'string') {
        return wrapContentBlock(`${bloatBanner}<span class="tool-use-label">result (${esc(block.tool_use_id || '')})</span><div class="pre-text">${esc(rc)}</div>`, block, index, blocks.length, options);
      }
      if (Array.isArray(rc)) {
        const parts = rc.map(c => {
          if (c.type === 'text') return `<div class="pre-text">${esc(c.text)}</div>`;
          if (c.type === 'image' || c.type === 'input_image') {
            const renderedImage = renderImageElementForBlock(c);
            if (renderedImage) return renderedImage;
          }
          return `<pre>${esc(JSON.stringify(c))}</pre>`;
        }).join('');
        return wrapContentBlock(`${bloatBanner}<span class="tool-use-label">result</span>${parts}`, block, index, blocks.length, options);
      }
      return wrapContentBlock(`${bloatBanner}<pre>${esc(JSON.stringify(block, null, 2))}</pre>`, block, index, blocks.length, options);
    }
    if (block.type === 'image' || block.type === 'input_image') {
      const renderedImage = renderImageBlock(block, index, blocks.length, options);
      if (renderedImage) return renderedImage;
      const source = block.source || {};
      const fileId = block.file_id || source.file_id;
      const hasUrl = block.image_url || source.url;
      const label = fileId ? `image: file_id ${fileId}` : hasUrl ? 'image: url' : `image: ${source.media_type || 'unknown'}`;
      return wrapContentBlock(`<span class="content-image-placeholder">${esc(label)}</span>`, block, index, blocks.length, options);
    }
    if (block.type === 'raw') return wrapContentBlock(`<pre>${esc(JSON.stringify(block.value, null, 2))}</pre>`, block, index, blocks.length, options);
    /* A native Bedrock `toolResult` and the *_call_output shapes fall through to
       generic JSON rendering, but the sidebar badges them, so the warning has to
       reach here too or the badge looks unfounded. */
    return wrapContentBlock(`${toolBloatBanner(block)}<pre>${esc(JSON.stringify(block, null, 2))}</pre>`, block, index, blocks.length, options);
  }).join('');
  const recovered = role === 'user'
    ? recoveredImagesForContent(content).map((block, index, images) => renderImageBlock(block, index, images.length)).join('')
    : '';
  return renderedBlocks + recovered;
}

function valueHasReadableEscapes(value) {
  if (typeof value === 'string') {
    return value.includes('\n')
      || value.includes('\r')
      || value.includes('\t')
      || /\\(?:r\\n|n|r|t|"|u[0-9a-fA-F]{4})/.test(value);
  }
  if (Array.isArray(value)) return value.some(valueHasReadableEscapes);
  if (value && typeof value === 'object') return Object.values(value).some(valueHasReadableEscapes);
  return false;
}

function decodeEscapedTextForView(value) {
  if (typeof value !== 'string') return '';
  return value
    .replace(/\\r\\n/g, '\n')
    .replace(/\\n/g, '\n')
    .replace(/\\r/g, '\n')
    .replace(/\\t/g, '\t')
    .replace(/\\"/g, '"')
    .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => {
      try { return String.fromCharCode(parseInt(hex, 16)); }
      catch { return `\\u${hex}`; }
    })
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n');
}

function renderToolInput(input) {
  const raw = JSON.stringify(input, null, 2) || '';
  if (!valueHasReadableEscapes(input)) return `<pre>${esc(raw)}</pre>`;
  const decoded = decodeEscapedTextForView(raw);
  const copyIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
  return `<div class="tool-input-readable">`
    + `<span class="tool-input-actions">`
    + `<button type="button" class="tool-input-btn tool-input-copy" title="${esc(t('copy'))}" aria-label="${esc(t('copy'))}">${copyIcon}</button>`
    + `<button type="button" class="tool-input-btn tool-input-toggle" aria-expanded="false" title="${esc(t('string_expand_escapes'))}" aria-label="${esc(t('string_expand_escapes'))}">↵</button>`
    + `</span>`
    + `<pre class="tool-input-view" data-raw="${encodeCopyText(raw)}" data-decoded="${encodeCopyText(decoded)}">${esc(raw)}</pre>`
    + `</div>`;
}

function renderTools(tools) {
  return tools.map(td => {
    const name = toolDisplayName(td) || 'unknown', desc = toolDescription(td);
    const shortDesc = desc.split('\n')[0].substring(0, 120);
    const schema = toolSchema(td);
    const props = schema.properties || {};
    const required = new Set(schema.required || []);
    let paramsHtml = '';
    const keys = Object.keys(props);
    if (keys.length) {
      paramsHtml = `<div class="tb-params-title">${t('params')}</div>` + keys.map(k => {
        const p = props[k], type = p.type || (p.enum ? 'enum' : ''), pdesc = p.description || '';
        const req = required.has(k) ? `<span class="tb-prequired">${t('required')}</span>` : '';
        const typeTag = type ? `<span class="tb-ptype">${esc(type)}</span>` : '';
        const descLine = pdesc ? `<div class="tb-pdesc">${esc(pdesc)}</div>` : '';
        return `<div class="tb-param"><div class="tb-param-row1"><span class="tb-pname">${esc(k)}</span>${typeTag}${req}</div>${descLine}</div>`;
      }).join('');
    }
    return `<div class="tool-block"><div class="tool-block-header"><span class="tb-arrow">&#9654;</span><span class="tb-name">${esc(name)}</span><span class="tb-desc">${esc(shortDesc)}</span></div><div class="tool-block-body">${desc ? `<div class="tb-full-desc">${esc(desc)}</div>` : ''}${paramsHtml}</div></div>`;
  }).join('');
}

function renderResponseContent(body, contextOnly = false) {
  if (!body?.content) {
    const msg = contextOnly ? t('response_context_only') : t('no_content');
    return `<em style="color:var(--text-tertiary)">${msg}</em>`;
  }
  return renderContent(body.content, 'assistant');
}

/* Size at which a single tool result is worth pointing out, in UTF-8 bytes.

   Tool result sizes are heavy-tailed: sampling local Claude Code transcripts put
   the median in the low hundreds of bytes while the largest result ran past
   600,000.  10,000 bytes sits far out on that tail, so it flags the few results
   big enough to dominate a turn's context without touching the ordinary file
   reads and greps that make up almost all of the distribution.

   Measured in bytes, not `text.length`: that counts UTF-16 code units, so CJK
   and emoji output would be judged smaller than it is -- 4,000 CJK characters
   exceed 10 KB while reading as 4,000 "characters".  The Python detector in
   viewer.py applies the same threshold to the same unit; the two must agree or a
   badge shows up in one view and not the other. */
const TOOL_BLOAT_MIN_BYTES = 10000;

/* Bytes per token, for turning a result's size into a rough token cost.
   Deliberately coarse -- the point is the order of magnitude, and every estimate
   built on it is labelled as approximate.  Roughly right for ASCII; CJK runs
   nearer 1.5 bytes per token, so its token count is under-reported even though
   its byte count is now correct. */
const BYTES_PER_TOKEN = 4;

function textSizeBytes(text) {
  if (typeof TextEncoder === 'function') return new TextEncoder().encode(text).length;
  /* No TextEncoder (very old engines): approximate from code points rather than
     falling back to a UTF-16 length that under-counts every non-ASCII result. */
  let bytes = 0;
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    bytes += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
  }
  return bytes;
}

/* Both the Anthropic and the Responses shapes arrive here as `tool_result`:
   `responseInputItemToMessage` rewrites `*_call_output` items before any
   renderer sees them.  Bedrock Converse `toolResult` blocks reach us unchanged,
   so they are matched explicitly. */
/* `computer_screenshot` is the Responses shape for a screenshot handed back by
   a computer-use call; it carries the same data URL an image block would. */
const BLOAT_IMAGE_TYPES = new Set(['image', 'input_image', 'computer_screenshot']);

function isRecognizedImageObject(value) {
  return !!(value && typeof value === 'object' && (
    BLOAT_IMAGE_TYPES.has(value.type)
    || 'source' in value
    || 'media_type' in value
    || 'image_url' in value
    || 'data' in value
  ));
}

function isBloatImagePayload(value) {
  /* A domain field named `image` (for example a container tag) is not an
     image block and still consumes context as text. */
  return !!(value && typeof value === 'object' && (
    BLOAT_IMAGE_TYPES.has(value.type) || isRecognizedImageObject(value.image)
  ));
}

/* The payload lives in `output` on the *_call_output shapes and in `content`
   everywhere else; reading `content` for the former sizes them all as empty. */
const BLOAT_OUTPUT_TYPES = new Set(['function_call_output', 'computer_call_output', 'custom_tool_call_output']);

function toolResultBloatPayload(block) {
  /* Display may summarize or pretty-print a result; `_bloatPayload` keeps
     the raw value so the banner measures the same bytes as the sidebar. */
  if (block._bloatPayload !== undefined) return { matched: true, rc: block._bloatPayload };
  if (block.type === 'tool_result') return { matched: true, rc: block.content };
  if (BLOAT_OUTPUT_TYPES.has(block.type)) {
    return { matched: true, rc: 'output' in block ? block.output : block.content };
  }
  if (block.toolResult && typeof block.toolResult === 'object') {
    return { matched: true, rc: block.toolResult.content };
  }
  return { matched: false, rc: null };
}

function toolResultBloatInfo(block) {
  if (!block || typeof block !== 'object') return null;
  const payload = toolResultBloatPayload(block);
  if (!payload.matched) return null;
  const rc = payload.rc;
  let text = '';
  if (typeof rc === 'string') {
    text = rc;
  } else if (Array.isArray(rc)) {
    /* Python drops an image block and a null part outright, so neither leaves
       a separator behind, but it keeps an empty string and an empty `text` --
       and keeps their separators.  Filtering on truthiness erases all four
       alike, which puts the two detectors one byte apart at the threshold and
       shows a sidebar badge with no detail banner.  Dropped parts are marked
       instead, so only they lose their separator. */
    text = rc.map(c => {
      if (typeof c === 'string') return c;
      if (c && typeof c === 'object') {
        /* Image payloads are billed by dimension, not by tokenizing their
           base64, so their encoded bytes are not context text. */
        if (isBloatImagePayload(c)) return null;
        /* Collapse to `text` only for type 'text', the one shape the array
           branch above special-cases; it dumps every other part whole, so
           sizing `text` for those hides whatever sits beside it.  A `text`
           alone is not enough ({text: 'summary', logs: <25 KB>} has no type at
           all), and neither is a text-ish type: an 'output_text' part is
           displayed in full, so 25 KB of siblings read as 'summary'. */
        if (typeof c.text === 'string' && c.type === 'text') return c.text;
        return JSON.stringify(c);
      }
      return c === null || c === undefined ? null : JSON.stringify(c);
    }).filter(part => part !== null).join('\n');
  } else if (rc && typeof rc === 'object') {
    if (isBloatImagePayload(rc)) return null;
    text = JSON.stringify(rc);
  }
  const byteCount = textSizeBytes(text);
  if (byteCount < TOOL_BLOAT_MIN_BYTES) return null;
  return {
    byteCount,
    sizeKB: (byteCount / 1024).toFixed(1),
    estTokens: Math.round(byteCount / BYTES_PER_TOKEN),
  };
}

/* Coerce a size that came from trace-supplied metadata.  Returning a number
   rather than the original value keeps a crafted string out of the badge
   template, which interpolates this into innerHTML. */
function bloatSizeKbFromMetadata(value) {
  const n = Number(value);
  return Number.isFinite(n) && n >= 0 ? n.toFixed(1) : null;
}

/* Scanning an entry walks every request message and UTF-8-encodes every tool
   result in it.  The sidebar rebuilds all of its items on each search keystroke,
   sort change and locale switch, so without this the scan cost is paid again on
   every one of those for every visible row. */
function detectEntryToolBloat(entry) {
  /* Keyed by stable identity, not by request_id alone: a retried or
     WebSocket-split request produces several entries sharing one ID, so an ID
     key would hand the first entry's verdict to all of them and let a clean
     turn and an oversized one swap badges by render order.

     entryStableKey names an unidentifiable row 'entry', which would merge every
     such row into one cache slot; those are rescanned instead. */
  const key = entryStableKey(entry);
  const cacheable = key && key !== 'entry';
  if (cacheable && toolBloatCache.has(key)) return toolBloatCache.get(key);
  const result = computeEntryToolBloat(entry);
  if (cacheable) toolBloatCache.set(key, result);
  return result;
}

function computeEntryToolBloat(entry) {
  if (entry?._tool_bloat) {
    const tb = entry._tool_bloat;
    const byteCount = Number(tb.byte_count);
    const haveBytes = Number.isFinite(byteCount) && byteCount >= 0;
    /* Derive KB from the byte count with the same expression the detail
       detector uses, rather than from the figure Python already rounded.  The
       two round halfway cases apart -- Python's `round` goes to even while
       `toFixed` goes up, so 10,496 bytes read 10.2KB in the sidebar and
       10.3 KB on opening the same entry -- and the whole point of this feature
       is that both detectors report one size.  `size_kb` is the fallback for
       metadata that predates `byte_count`. */
    const sizeKB = haveBytes ? (byteCount / 1024).toFixed(1) : bloatSizeKbFromMetadata(tb.size_kb);
    if (sizeKB === null) return [];
    return [{
      byteCount: haveBytes ? byteCount : 0,
      sizeKB,
      estTokens: haveBytes ? Math.round(byteCount / BYTES_PER_TOKEN) : 0,
      _count: Number(tb.count) || 1,
    }];
  }
  /* A stub with no bloat metadata was already scanned server-side and found
     clean.  Resolving it here would pull and parse the full record for every
     visible row, defeating lazy loading on exactly the large traces it exists
     for. */
  if (entry?._isStub) return [];
  const resolved = resolveEntryForDetail(entry);
  const reqBody = resolved?.request?.body;
  if (!reqBody) return [];
  const bloated = [];
  getMessages(reqBody, { forBloat: true }).forEach(msg => {
    /* OpenAI Chat Completions puts the result straight on a tool-role message
       instead of wrapping it in a tool_result block. */
    if (msg?.role === 'tool') {
      const info = toolResultBloatInfo({ type: 'tool_result', content: msg.content });
      if (info) bloated.push(info);
      return;
    }
    const blocks = Array.isArray(msg?.content) ? msg.content : (typeof msg?.content === 'object' && msg?.content ? [msg.content] : []);
    blocks.forEach(b => {
      const info = toolResultBloatInfo(b);
      if (info) bloated.push(info);
    });
  });
  return bloated;
}

function renderTokenUsage(u) {
  const items = [
    { label: t('tok_input'), val: u.input_tokens || 0, color: 'var(--blue)' },
    { label: t('tok_output'), val: u.output_tokens || 0, color: 'var(--green)' },
    { label: t('tok_cache_read'), val: u.cache_read_input_tokens || 0, color: 'var(--cyan)' },
    { label: t('tok_cache_create'), val: u.cache_creation_input_tokens || 0, color: 'var(--amber)' },
  ];
  return `<div class="token-bar">${items.map(i =>
    `<div class="tok-item"><span class="tok-dot" style="background:${i.color}"></span><span class="tok-label">${i.label}</span><span class="tok-val">${i.val.toLocaleString()}</span></div>`
  ).join('')}</div>`;
}

function renderSSEEvents(events) {
  return events.map(e => {
    const eventType = getEventType(e) || 'event';
    const payload = Object.prototype.hasOwnProperty.call(e, 'data') ? e.data : e;
    const data = typeof payload === 'string' ? payload : JSON.stringify(payload);
    const short = data.length > 200 ? data.substring(0, 200) + '...' : data;
    return `<div class="sse-event"><span class="sse-type">${esc(eventType)}</span><span class="sse-data">${esc(short)}</span></div>`;
  }).join('');
}

/* ─── Section ─── */
function encodeCopyText(text) {
  return btoa(unescape(encodeURIComponent(text)));
}

function section(title, body, defaultOpen = true, copyText = null, badge = null) {
  const oc = defaultOpen ? 'open' : '', ac = defaultOpen ? 'chevron open' : 'chevron';
  let extra = '';
  if (badge) extra += `<span class="badge">${esc(badge)}</span>`;
  if (copyText !== null) extra += `<button class="copy-btn" data-copy="${encodeCopyText(copyText)}">${t('copy')}</button>`;
  return `<div class="section"><div class="section-header"><span class="${ac}">&#9654;</span><span class="title">${title}</span>${extra}</div><div class="section-body ${oc}">${body}</div></div>`;
}

function bindSections(container) {
  container.querySelectorAll('.section-header').forEach(h => {
    h.addEventListener('click', ev => {
      if (ev.target.classList.contains('copy-btn')) {
        const text = decodeURIComponent(escape(atob(ev.target.dataset.copy)));
        copyToClipboard(text, ev.target);
        return;
      }
      h.nextElementSibling.classList.toggle('open');
      h.querySelector('.chevron').classList.toggle('open');
    });
  });
