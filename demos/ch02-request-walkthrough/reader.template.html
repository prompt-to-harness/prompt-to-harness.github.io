<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>请求阅读视图</title><style>
*{box-sizing:border-box}body{margin:0;font:18px/1.65 system-ui,sans-serif;color:#263345;background:#fffdf8}main{padding:20px 26px;max-width:1160px;margin:auto}body.expanded{font-size:22px}body.expanded pre{font-size:20px}h2{font-size:25px;margin:8px 0 12px}h3{font-size:20px;margin:15px 0 8px}p{margin:8px 0}pre{font-size:17px;background:#f0eee7;padding:14px;overflow:auto;line-height:1.5}pre,code{font-family:ui-monospace,monospace;overflow-wrap:anywhere}pre code{white-space:pre-wrap}code{font-size:.9em}details{border:1px solid #cec6b5;border-radius:7px;margin:12px 0;padding:10px 14px}summary{cursor:pointer;font-weight:600;color:#315a43}.meta{font-size:14px;color:#806124;border-bottom:1px solid #ddd3bd;padding-bottom:9px;margin-bottom:16px}.xml-tag{display:block;font-size:13px;color:#7c796e;font-family:monospace;margin:10px 0}.evidence{border-left:4px solid #ad8842;padding:8px 16px;background:#f5f1e6}.notice{font-size:15px;color:#6b665a}li{margin:5px 0}[hidden]{display:none!important}a{color:#315a43}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px}button:focus-visible,summary:focus-visible{outline:3px solid #ad8842}@media(max-width:600px){body{font-size:16px}main{padding:14px}pre{font-size:13px}}
</style></head><body><main>__POINTS__</main><script>
(()=>{const channel='ch02-request-walkthrough-v1';function choose(key,expanded){const target=document.getElementById(key);if(!target)return;document.querySelectorAll('[data-reader-point]').forEach(n=>n.hidden=n!==target);document.body.classList.toggle('expanded',!!expanded);document.body.dataset.coursePoint=key;window.scrollTo(0,0);parent.postMessage({channel,ready:true,key},'*');}window.addEventListener('message',e=>{if(e.source===parent&&e.data?.channel===channel&&!e.data.ready)choose(e.data.key,e.data.expanded)});document.addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({channel,escape:true},'*')});parent.postMessage({channel,ready:true},'*');choose(new URLSearchParams(location.search).get('point')||'identity',parent===window);})();
</script></body></html>
