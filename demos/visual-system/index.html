<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>知识页型原型：1.2 节 Agent、Context 与 Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&family=ZCOOL+KuaiLe&family=Long+Cang&display=swap" rel="stylesheet">
<style>
:root{--ui-bg:#EEF0F3;--ui-panel:#FFFFFF;--ui-ink:#1B2230;--ui-muted:#626C7A;--ui-rule:#D5DAE1;--ui-acc:#4338CA;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui-bg:#12151B;--ui-panel:#1A1F27;--ui-ink:#E4E7EC;--ui-muted:#9AA3AF;--ui-rule:#323946;--ui-acc:#9D97FF}}
:root[data-theme="dark"]{--ui-bg:#12151B;--ui-panel:#1A1F27;--ui-ink:#E4E7EC;--ui-muted:#9AA3AF;--ui-rule:#323946;--ui-acc:#9D97FF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--ui-bg);color:var(--ui-ink);font:15px/1.55 "Noto Sans SC",system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ui-acc);outline-offset:2px}
.bar{display:flex;flex-direction:column;gap:6px;padding:8px 14px;background:var(--ui-panel);border-bottom:1px solid var(--ui-rule)}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.bar h1{font-size:15px;margin:0 4px 0 0;font-weight:700}
.grp{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.grp>.l{color:var(--ui-muted);font-size:13px;margin-right:2px}
.grp button{border:1px solid var(--ui-rule);background:transparent;border-radius:5px;padding:3px 9px;font-size:13.5px}
.grp button[aria-pressed="true"]{background:var(--ui-acc);border-color:var(--ui-acc);color:#fff}
.grp button.sp{border-style:dashed}
.stepi{font-size:13px;color:var(--ui-muted);min-width:64px;text-align:center}
.main{flex:1;display:flex;min-height:0}
.view{flex:1;display:grid;place-items:center;overflow:hidden;padding:14px;min-width:0}
.frame{position:relative;overflow:hidden;box-shadow:0 1px 0 var(--ui-rule),0 10px 34px rgba(0,0,0,.14)}
.info{width:330px;flex:none;overflow:auto;padding:16px 18px;background:var(--ui-panel);border-left:1px solid var(--ui-rule);font-size:14px}
.info h2{font-size:17px;margin:0 0 2px}
.info h3{font-size:13px;color:var(--ui-muted);margin:14px 0 3px;font-weight:700}
.info p{margin:0}
.tagc{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:4px;background:var(--ui-bg);border:1px solid var(--ui-rule);font-size:12.5px}
@media (max-width:900px){.main{flex-direction:column}.info{width:auto;border-left:0;border-top:1px solid var(--ui-rule);max-height:36vh}}

/* ===== 幻灯片：固定浅色，不随界面主题变化 ===== */
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--stage-bg,#F6F7F9);color:#18202B;font-family:"Noto Sans SC",sans-serif;overflow:hidden;
 --ink:#18202B;--muted:#5B6573;--agent:#5A51D1}
.hd{position:absolute;left:56px;top:40px;width:872px}
.kick{margin:0 0 10px;font-size:20px;font-weight:700;color:var(--agent)}
.hd h2{margin:0;font-size:40px;line-height:1.32;font-weight:900;letter-spacing:.01em}
.bd{position:absolute;left:56px;top:262px;width:1168px;height:370px}
.bd>svg{width:100%;height:100%;overflow:visible;display:block}
svg text{font-family:"Noto Sans SC",sans-serif}
.mono{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none}
[data-s],[data-n]{transition:opacity .35s ease,transform .35s ease}
.hide{opacity:0!important;transform:translateY(8px)}
.past{opacity:.42}
@media (prefers-reduced-motion:reduce){[data-s],[data-n]{transition:none}}
.rough{filter:url(#rough)}

/* 皮肤：手绘线条（两种都用） */
.skin-handT .bd rect,.skin-handT .bd path,.skin-handT .bd circle{filter:url(#rough)}
.skin-handT .bd marker path,.skin-handT .bd .nf *,.skin-handT .bd .nf1{filter:none}
/* 皮肤：手绘线条 + 手写标题 */
.skin-handT .hd h2{font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;font-weight:400;font-size:46px;line-height:1.26;letter-spacing:.02em}
.skin-handT .kick{font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;font-weight:400;font-size:22px}
.skin-handT .bd text.big{font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;font-weight:400}

.pg-comic.skin-sp-hand .hd h2{font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;font-weight:400;font-size:44px}
.skin-sp-hand .kick{font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;font-weight:400;font-size:22px}
/* 专用页：章节开篇（白板手写） */
.pg-cover .ck{position:absolute;left:56px;top:48px;font-size:20px;color:#5B6573;font-weight:700;margin:0}
.pg-cover h2{position:absolute;left:56px;top:84px;margin:0;font-family:"Long Cang","ZCOOL KuaiLe",cursive;font-weight:400;font-size:96px;line-height:1.08;color:#1D2B4F}
.pg-cover .sub{position:absolute;left:60px;top:318px;margin:0;font-size:26px;color:#3B4454}
/* 专用页：漫画记忆点 */
.pg-comic .kick{color:#B42318}
.pg-comic .hd h2{display:inline-block;background:#fff;border:4px solid #111;box-shadow:7px 7px 0 #111;padding:8px 20px 10px;transform:rotate(-1deg);font-size:40px}
/* 专用页：涂鸦小结 */
.hw{font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif!important;font-weight:400!important}

.kseg{display:inline-flex;gap:5px;margin-left:14px;vertical-align:4px}
.kseg i{display:block;width:26px;height:6px;border-radius:3px;background:transparent;box-shadow:inset 0 0 0 1.5px #C9C5F2}
.kseg i.d{background:#ABA6E9;box-shadow:none}.kseg i.c{background:#5A51D1;box-shadow:none}
.chap{position:absolute;left:56px;width:1168px;bottom:8px;height:30px;display:flex;gap:6px;z-index:4;pointer-events:none}
.chap .sg{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;min-width:0}
.chap .lb{font:500 14px/1 "Noto Sans SC",sans-serif;color:#8A8578;white-space:nowrap;overflow:hidden;text-overflow:clip}
.chap .sg.c .lb{color:#2A2380;font-weight:700}
.chap .tr{height:6px;border-radius:3px;background:rgba(90,81,209,.14);overflow:hidden}
.chap .fl{height:100%;background:#ABA6E9;border-radius:3px}
.chap .sg.c .fl{background:#5A51D1}
.chap2{height:22px;align-items:center;gap:14px}
.chap2 .cur{flex:none;display:flex;gap:8px;align-items:baseline;font:700 15px/1 "Noto Sans SC",sans-serif;color:#2A2380}
.chap2 .cur span{font-weight:500;font-size:13px;color:#8A8578}
.chap2 .trk{flex:1;display:flex;gap:5px}
.chap2 .tr{flex-basis:0}.chap2 .tr.c .fl{background:#5A51D1}
.pg-rec .chap .lb{color:#6B7280}.pg-rec .chap .sg.c .lb{color:#2A2380}
/* 讲师区 */
.cam{position:absolute;left:956px;top:24px;width:300px;height:225px;border-radius:10px;overflow:hidden;background:#2B3240;z-index:5}
.cam .lbl{position:absolute;left:10px;bottom:8px;font-size:13px;color:#C9D0DA}
/* 安全区 */
.safe{position:absolute;inset:0;pointer-events:none;z-index:6;display:none}
.showsafe .safe{display:block}
.safe .dm{position:absolute;left:0;top:0;width:100%;height:180px;background:repeating-linear-gradient(135deg,rgba(217,72,28,.10) 0 10px,transparent 10px 20px);border-bottom:2px dashed rgba(217,72,28,.55)}
.safe .sub2{position:absolute;left:0;bottom:0;width:100%;height:80px;background:repeating-linear-gradient(135deg,rgba(67,56,202,.10) 0 10px,transparent 10px 20px);border-top:2px dashed rgba(67,56,202,.55)}
.safe .body{position:absolute;left:56px;top:262px;width:1168px;height:370px;outline:2px dashed rgba(15,138,122,.6)}
.safe span{position:absolute;font-size:15px;font-weight:700;background:#fff;padding:2px 8px;border-radius:4px}
.safe .dm span{right:330px;bottom:6px;color:#B23A14}
.safe .sub2 span{left:24px;top:8px;color:#4338CA}
.safe .subx{position:absolute;left:50%;top:10px;transform:translateX(-50%);font:500 26px/1.2 "Noto Sans SC",sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:3px 12px;border-radius:4px;white-space:nowrap}
.safe .body span{left:8px;bottom:8px;color:#0B6B5F}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1400" height="600"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></svg>
<div class="bar">
 <div class="row"><h1>1.2 节演示页 · 统一视觉</h1>
  <div class="grp" role="group" aria-label="显示"><button id="tSafe" aria-pressed="false">安全区</button></div>
 </div>
 <div class="row">
  <div class="grp" id="pages" role="group" aria-label="页面"><span class="l">页面</span></div>
  <div class="grp"><button id="prev" aria-label="上一步">←</button><span class="stepi" id="stepi"></span><button id="next" aria-label="下一步">→</button></div>
 </div>
</div>
<div class="main">
 <div class="view" id="view"><div class="frame" id="frame"><div class="stage" id="stage"></div></div></div>
 <aside class="info" id="info"></aside>
</div>
<script>
/* ---------- SVG 小工具 ---------- */
const C={ink:'#18202B',muted:'#5B6573',rule:'#D9DEE5',us:'#243042',agent:'#5A51D1',agentL:'#EDEBFB',agentM:'#ABA6E9',agentD:'#2A2380',tool:'#0F8A7A',toolL:'#E0F3EF',toolT:'#0B6B5F',evid:'#B45309',evidL:'#FDF0D5',ctx:'#9C8B66',ctxL:'#F2EDE1',ctxT:'#6E6043',gate:'#D9481C',gateL:'#FCE6DD',ok:'#15803D',okL:'#E3F2E6',white:'#FFFFFF'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function T(x,y,lines,o={}){const L=Array.isArray(lines)?lines:[lines];const fs=o.fs||22,lh=o.lh||fs*1.4,a=o.a||'start';
 const cls=[o.mono?'mono':'',(!o.mono&&fs>=24&&(o.fw||500)>=800)?'big':'',o.hw?'hw':''].filter(Boolean).join(' ');
 return `<text x="${x}" y="${y}" font-size="${fs}" font-weight="${o.fw||500}" fill="${o.c||C.ink}" text-anchor="${a}"${cls?` class="${cls}"`:''}>${L.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${esc(l)}</tspan>`).join('')}</text>`}
const R=(x,y,w,h,f,s,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??10}" fill="${f}"${s?` stroke="${s}" stroke-width="${o.sw||2.5}"`:''}${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.cls?` class="${o.cls}"`:''}/>`;
const A=(d,c=C.muted,o={})=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${o.sw||2.5}"${o.dash?` stroke-dasharray="${o.dash}"`:''} marker-end="url(#m-${o.m||'g'})"${o.cls?` class="${o.cls}"`:''}/>`;
const defs=`<defs>${[['g',C.muted],['r',C.gate],['a',C.agent],['t',C.tool],['k','#111']].map(([k,c])=>`<marker id="m-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}</defs>`;
const G=(s,inner)=>`<g data-s="${s}">${inner}</g>`;
const check=(x,y,ok)=>'<g class="nf">'+check0(x,y,ok)+'</g>';
const check0=(x,y,ok)=>ok===true?`<circle cx="${x}" cy="${y}" r="15" fill="${C.ok}"/><path d="M${x-7} ${y}l5 5l9-10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
 :ok===false?`<circle cx="${x}" cy="${y}" r="15" fill="${C.gate}"/><path d="M${x-6} ${y-6}l12 12M${x+6} ${y-6}l-12 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>`
 :`<circle cx="${x}" cy="${y}" r="15" fill="none" stroke="${C.muted}" stroke-width="2.5"/><path d="M${x-7} ${y}h14" stroke="${C.muted}" stroke-width="3" stroke-linecap="round"/>`;

/* ---------- 六个页型 ---------- */
const K=[
{n:'执行循环',type:'分层模型图 + 真实映射',kick:'1.2　执行循环',h:'一次协作是一个循环<br>每一轮都由人检查证据再放行',steps:5,
 why:'上排是概念，下排是第 1 节里对应的具体证据。概念和实例同屏，学员不用在“定义页”和“例子页”之间来回记。',
 cue:'每出现一个节点，讲师看向该节点说一句；最后一步看镜头，讲“人不放行，循环就不会继续”。',
 ev:()=>{const xs=[98,339,580,821,1062],W=196;
  const node=(i,title,sub,fill,stroke,tc)=>R(xs[i]-W/2,24,W,100,fill,stroke,{rx:12})+T(xs[i],64,title,{a:'middle',fs:26,fw:800,c:tc})+T(xs[i],100,sub,{a:'middle',fs:20,c:tc,fw:500});
  const chip=(i,lines)=>R(xs[i]-W/2,168,W,86,'#fff',C.rule,{rx:8,sw:2})+T(xs[i]-W/2+14,202,lines,{fs:20,lh:30,c:C.ink});
  const arr=i=>A(`M${xs[i]+W/2+4} 74 L${xs[i+1]-W/2-6} 74`);
  const link=i=>`<path d="M${xs[i]} 128 V162" stroke="${C.rule}" stroke-width="2" stroke-dasharray="4 5"/>`;
  return `<svg viewBox="0 0 1168 370">${defs}
  ${G(1,node(0,'人','目标与限制',C.us,null,'#fff')+link(0)+chip(0,['改项目介绍','只动 README'])+arr(0)+node(1,'Agent','组织下一步',C.agentM,null,C.agentD)+link(1)+chip(1,['先读取，再说明','准备改哪一段']))}
  ${G(2,arr(1)+node(2,'Tool','读取、修改、执行',C.toolL,C.tool,C.toolT)+link(2)+R(xs[2]-W/2,168,W,86,'#fff',C.rule,{rx:8,sw:2})+T(xs[2]-W/2+14,202,['read README.md','apply_patch'],{fs:18,lh:30,mono:1}))}
  ${G(3,arr(2)+node(3,'Context','结果汇入当前信息',C.ctxL,C.ctx,C.ctxT)+link(3)+chip(3,['原文、写入状态','diff 文本']))}
  ${G(4,arr(3)+node(4,'人的门禁','检查证据',C.gateL,C.gate,'#9A2F10')+link(4)+chip(4,['核对 diff','和 git status']))}
  ${G(5,A('M1000 258 V300 Q1000 322 978 322 H365 Q343 322 343 300 V262',C.agent,{m:'a'})+T(672,352,'继续：回到 Agent 组织下一步',{a:'middle',fs:22,fw:700,c:C.agent})+T(1160,300,['修正：改请求'],{a:'end',fs:20,c:C.muted})+T(1160,352,['停止：不放行'],{a:'end',fs:20,c:C.gate,fw:700}))}
  ${T(0,300,'下排：第 1 节里对应的证据（教学示例）',{fs:18,c:C.muted})}
  </svg>`}},

{n:'Context Window',type:'可见 / 不可见对照',kick:'1.2　Context Window',h:'没有读进来的文件，对 Agent 来说就不存在',steps:4,
 why:'用“整个仓库”和“本轮 Context”两个容器并排，把抽象的容量概念变成看得见的差集。最后一步给出错误推断的样子，便于学员以后自查。',
 cue:'第 2 步讲师视线从左移到右，跟着 README 的移动；第 4 步看镜头问：“它凭什么知道有测试？”',
 ev:()=>{const files=['README.md','package.json','src/','\u00a0\u00a0index.html','\u00a0\u00a0styles.css','tests/','\u00a0\u00a0home.spec.ts','docs/','\u00a0\u00a0guide.md','.github/workflows/'];
  const tree=files.map((f,i)=>{const read=f==='README.md';return `<g ${read?'data-s="2"':''}>${read?R(20,44+i*29,300,28,C.toolL,null,{rx:5}):''}</g>`+T(34,65+i*29,f,{fs:20,mono:1,c:read?C.ink:'#8A93A0'})}).join('');
  const slot=(y,t,sub,f,s,tc)=>R(620,y,380,62,f,s,{rx:8,sw:2})+T(640,y+28,t,{fs:22,fw:700,c:tc})+T(640,y+52,sub,{fs:18,c:C.muted});
  return `<svg viewBox="0 0 1168 370">${defs}
  ${G(1,R(0,0,360,350,'#fff',C.rule,{rx:12,sw:2})+T(20,32,'整个仓库',{fs:22,fw:800})+T(340,32,'约 1,200 个文件',{a:'end',fs:18,c:C.muted})+tree)}
  ${G(2,A('M330 72 C440 72 500 148 612 148',C.tool,{m:'t'})+T(462,92,'读取',{a:'middle',fs:20,fw:700,c:C.toolT})+R(600,0,420,350,C.agentL,C.agent,{rx:12,sw:2.5})+T(620,32,'本轮 Context',{fs:22,fw:800,c:C.agent})+slot(118,'已读取的文件','README.md 的原文',C.toolL,C.tool,C.toolT))}
  ${G(3,slot(48,'人的请求','目标、范围、完成标准','#fff',C.rule,C.ink)+slot(188,'工具返回','写入状态、diff 文本',C.ctxL,C.ctx,C.ctxT)+slot(258,'此前对话','上一轮的说明与确认','#fff',C.rule,C.ink)+R(620,330,260,12,'#fff',C.agent,{rx:6,sw:2})+R(620,330,210,12,C.agent,null,{rx:6})+T(1000,342,'容量有限',{fs:17,fw:700,c:C.agent,a:'end'}))}
  ${G(4,R(20,189,300,58,'none',C.gate,{rx:5,sw:2.5,dash:'6 5'})+A('M324 218 C520 300 900 330 1036 250',C.gate,{m:'r',dash:'6 6'})+R(1040,40,128,290,C.gateL,C.gate,{rx:10,sw:2.5,dash:'8 6'})+check(1104,40,false)+T(1104,92,['“项目里','应该有','测试”'],{a:'middle',fs:21,lh:30,fw:700,c:'#9A2F10'})+T(1104,214,['tests/','没读取'],{a:'middle',fs:20,lh:28,c:C.ink,mono:0})+T(1104,290,['不能','当成已知'],{a:'middle',fs:20,lh:28,fw:800,c:C.gate}))}
  </svg>`}},

{n:'Tool 与结果',type:'带解读的操作记录',kick:'1.2　Tool 与结果',h:'“做了什么”和“看到了什么”<br>要分成两条记录',steps:5,
 why:'三列表格：动作、结果、这个结果能说明什么。第三列是本页的知识点，它把“结果”和“结论”拆开，也为后面软件工程的验证习惯埋线。',
 cue:'每一行讲师先念动作，再看向第三列解释；第 4 行失败时停顿一下。',
 ev:()=>{const X=[0,318,700],Wd=[310,374,468];
  const hdr=['动作（Tool）','结果（返回的信息）','这个结果能说明什么'];
  const rows=[
   ['read README.md','返回原文，共 42 行','Agent 读到了这个文件的内容',null],
   ['apply_patch README.md','patch applied','写入成功；不说明改得对',null],
   ['git diff --stat','README.md | 6 +++---','实际改动的文件和规模',null],
   ['npm run build','command not found: npm','构建没有执行，不等于构建失败','fail']];
  const head=hdr.map((h,i)=>T(X[i]+16,30,h,{fs:20,fw:800,c:[C.toolT,C.ctxT,C.agent][i]})).join('')+`<path class="nf1" d="M0 46 H1168" stroke="${C.ink}" stroke-width="2"/>`;
  const row=(r,i)=>{const y=52+i*74,f=r[3]==='fail';return G(i+1,(f?R(0,y,1168,68,C.gateL,null,{rx:6}):`<path class="nf1" d="M0 ${y+70} H1168" stroke="${C.rule}" stroke-width="1.5"/>`)+
   R(X[0]+12,y+14,Wd[0]-24,40,C.toolL,null,{rx:6})+T(X[0]+24,y+42,r[0],{fs:19,mono:1,c:C.toolT})+

  if(mode==='kick'){const kk=stage.querySelector('.kick');if(kk&&!p.noSeg)kk.innerHTML=`1.2　${CIR[k]} ${SEGS[k][0]}<span class="kseg">${SEGS.map((x,i)=>`<i class="${i<k?'d':i===k?'c':''}"></i>`).join('')}</span>`}
  if(mode==='bar2'){stage.insertAdjacentHTML('beforeend',`<div class="chap chap2"><div class="cur"><b>${CIR[k]} ${SEGS[k][0]}</b><span>${k+1} / ${SEGS.length}</span></div><div class="trk">${SEGS.map((x,i)=>`<div class="tr${i===k?' c':''}" style="flex:${x[1]} 1 0"><div class="fl" style="width:${i<k?100:i===k?Math.round(segFrac(pg)*100):0}%"></div></div>`).join('')}</div></div>`)}
  if(mode==='bar'||mode==='bar3'){const nn=mode==='bar';stage.insertAdjacentHTML('beforeend',`<div class="chap">${SEGS.map((x,i)=>`<div class="sg${i===k?' c':''}" style="flex:${x[1]} 1 0"><div class="lb">${nn?CIR[i]+' ':''}${x[0]}</div><div class="tr"><div class="fl" style="width:${i<k?100:i===k?Math.round(segFrac(pg)*100):0}%"></div></div></div>`).join('')}</div>`)}
 })();
 stage.querySelectorAll('[data-n]').forEach(el=>el.classList.toggle('hide',+el.dataset.n!==st));
 $('stepi').textContent=`第 ${st} / ${p.steps} 步`;
 document.querySelectorAll('#pages button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===pg));
 $('tSafe').setAttribute('aria-pressed',safe);
 $('info').innerHTML=`<h2>${pg+1}. ${p.n}</h2><span class="tagc">${p.sp?p.tag.replace(/；背景跟随全局/,''):'知识页'}</span>
  <h3>页型</h3><p>${p.type}</p><h3>为什么这样设计</h3><p>${p.why}</p><h3>讲师视线与讲述</h3><p>${p.cue}</p>${SPEC}
  <h3>操作</h3><p>← → 或点画面逐步推进，最后一步再按进入下一页；1–9 直接跳到前 9 页；S 显示安全区。</p>`;
 fit();}
function fit(){const box=$('view'),W=box.clientWidth-28,H=box.clientHeight-28,s=Math.max(.1,Math.min(W/1280,H/720));
 const fr=$('frame');fr.style.width=1280*s+'px';fr.style.height=720*s+'px';stage.style.transform=`scale(${s})`}
function go(d){const p=P[pg];if(d>0){if(st<p.steps)st++;else if(pg<P.length-1){pg++;st=1}}else{if(st>1)st--;else if(pg>0){pg--;st=P[pg].steps}}render()}
$('pages').onclick=e=>{const b=e.target.closest('button');if(!b)return;pg=+b.dataset.i;st=1;render()};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('tSafe').onclick=()=>{safe=!safe;render()};
$('frame').onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
 if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){go(-1)}
 else if(/^[1-9]$/.test(e.key)){pg=+e.key-1;st=1;render()}else if(e.key.toLowerCase()==='s'){safe=!safe;render()}});
addEventListener('resize',fit);
try{const m=location.hash.match(/p=(\d+)(?:&s=(\d))?/);if(m){pg=Math.min(P.length-1,+m[1]-1);st=m[2]?+m[2]:1}const md=location.hash.match(/mode=(\w+)/);if(md&&MODES.some(x=>x[0]===md[1]))mode=md[1];}catch(e){}
render();document.fonts&&document.fonts.ready.then(fit);
</script>
</body>
