<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课程生图试验 · 现版与生图版对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F4F2EB;color:#243042;font-family:system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{margin:0 0 18px;line-height:1.6}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin-bottom:18px}label{display:grid;gap:5px;font-size:14px}select,button,a.action{font:inherit;color:inherit;background:#fffdf7;border:1px solid #A8A08F;border-radius:6px;padding:8px 12px}button,a.action{cursor:pointer;font-size:15px}a{color:#243042}a.action{text-decoration:none}iframe{display:block;width:100%;height:min(calc(56.25vw - 27px),calc(100dvh - 265px));min-height:200px;border:1px solid #C9C2B4;background:#F4F2EB}.note{font-size:14px;color:#5B6573;margin-top:14px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #0F8A7A;outline-offset:3px}
</style>
<main>
 <h1>课程生图试验</h1>
 <p>先比较章首／章末复用的节奏，再看章中图片是否值得保留 · <a href="characters.html">新增：三只猫与角色对照 ↗</a></p>
 <div class="controls">
  <label>试验页面<select id="topic"><optgroup label="固定位置 · 同图首尾复用"><option value="ch01-open">第 1 章 · 开头 p01</option><option value="ch01-close">第 1 章 · 结尾 p36-recap</option><option value="ch02-open">第 2 章 · 开头 p01</option><option value="ch02-close">第 2 章 · 结尾 p58</option></optgroup><optgroup label="第一轮 · 章中候选"><option value="prompt">第 1 章 p20 · 什么叫“好看”</option><option value="comic">第 2 章 p03 · 给熟人看了一眼</option></optgroup></select></label>
  <label>版本<select id="variant"><option value="image">生图版</option><option value="original">现版</option></select></label>
  <label>显示<select id="display"><option value="all">完整画面</option><option value="steps">逐步揭示</option></select></label>
  <button id="previous" type="button">← 上一步</button><button id="next" type="button">下一步 →</button>
  <a class="action" id="open" href="render.html?mode=slides&amp;lesson=ch01-open&amp;variant=image&amp;step=2" target="_blank" rel="noopener">单独打开画面 ↗</a>
 </div>
 <iframe id="preview" title="课程画面预览" src="render.html?mode=slides&amp;lesson=ch01-open&amp;variant=image&amp;step=2"></iframe>
 <p class="note">试验素材为生成的设计示意和情景漫画；文字与揭示顺序由课件控制。正式课件保持现版。<a href="README.md">制作记录与 Prompt</a></p>
</main>
<script>
const topic=document.querySelector('#topic'),variant=document.querySelector('#variant'),display=document.querySelector('#display'),preview=document.querySelector('#preview'),open=document.querySelector('#open');
function update(){const step=display.value==='all'?99:0;const url=`render.html?mode=slides&lesson=${topic.value}&variant=${variant.value}&step=${step}`;preview.src=url;open.href=url}
for(const control of [topic,variant,display])control.addEventListener('change',update);
document.querySelector('#previous').addEventListener('click',()=>preview.contentWindow.document.querySelector('#previous').click());
document.querySelector('#next').addEventListener('click',()=>preview.contentWindow.document.querySelector('#next').click());
</script>
</html>
